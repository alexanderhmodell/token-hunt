<title>Token Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 256x240 arcade screen centered on a dark server-room cabinet; the canvas is the page. Deliberately single-theme (arcade). */
:root{
  --cab:#0a0a12;
  --bezel:#262238;
  --ink:#e9e4d8;
  --dim:#8a8494;
  --accent:#3cd0ff;
  --glow:rgba(138,92,245,.18);
  --font-ui:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sl:4px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0; box-sizing:border-box; background:var(--cab); color:var(--ink);
  font:600 11px/1.6 var(--font-ui); letter-spacing:.08em;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.screen{position:relative; line-height:0; max-width:100%}
canvas{
  display:block; max-width:100%;
  image-rendering:pixelated; image-rendering:crisp-edges;
  cursor:crosshair; background:#2a6fd6; border-radius:3px;
  box-shadow:0 0 0 4px #000, 0 0 0 7px var(--bezel), 0 0 48px var(--glow);
}
canvas:focus-visible{outline:2px solid var(--accent); outline-offset:9px}
.crt{
  position:absolute; inset:0; pointer-events:none; border-radius:3px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0, rgba(0,0,0,.20) 1px, transparent 1px, transparent var(--sl));
}
body.nocrt .crt{display:none}
.crt::after{content:""; position:absolute; inset:0; border-radius:3px; box-shadow:inset 0 0 70px rgba(0,0,0,.42)}
#crtgl{position:absolute; left:0; top:0; display:block; pointer-events:none; border-radius:3px; background:#000}
.foot{color:var(--dim); font-size:10px; letter-spacing:.08em; text-align:center; line-height:1.9; max-width:96ch}
@media (max-width:600px){ body{padding-block:10px} }
@media (hover:none) and (pointer:coarse){ .foot .keys{display:none} }
.foot{margin-top:34px} /* the game-over buttons sit under the cabinet, never over the HUD; the gap is always reserved, so nothing jumps */
body.pointer canvas:focus-visible{outline:none}
.foot b{color:var(--accent); font-weight:normal}
body.cardopen #share,body.cardopen #brag{visibility:hidden}
#cardbox{position:fixed; inset:0; z-index:20; background:rgba(5,5,10,.97); display:flex; align-items:center; justify-content:center; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:16px}
.cardwrap{display:flex; flex-direction:column; align-items:center; gap:12px; max-width:100%}
#cardimg{display:block; width:min(86vw,72vh,540px); height:auto; image-rendering:pixelated; border:3px solid var(--bezel); user-select:auto; -webkit-user-select:auto; -webkit-touch-callout:default}
.cardhint{font:600 10px/1.6 var(--font-ui); letter-spacing:.08em; color:var(--dim); text-align:center}
#cardclose{font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--accent); border:0; padding:9px 16px; border-radius:2px; cursor:pointer}
#cardclose:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
#share{position:absolute; left:50%; bottom:-42px; transform:translateX(-112%); z-index:2; font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--ink); border:0; padding:8px 12px; cursor:pointer; border-radius:2px; box-shadow:0 2px 0 #000}
#brag{position:absolute; left:50%; bottom:-42px; transform:translateX(12%); z-index:2; font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--accent); border:0; padding:8px 12px; cursor:pointer; border-radius:2px; box-shadow:0 2px 0 #000}
#bragtxt{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6; width:min(88vw,420px); max-height:70vh; overflow:auto; background:var(--cab); border:2px solid var(--accent); padding:14px 16px; box-shadow:0 8px 40px rgba(0,0,0,.6); cursor:pointer}
#brag:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
#bragtxt{font:11px/1.8 var(--font-ui); color:var(--ink); user-select:text; -webkit-user-select:text; max-width:60ch; text-align:center; word-break:break-all}
@media (prefers-reduced-motion:reduce){.crt{display:none}}
</style>

<div class="screen">
  <canvas id="g" width="256" height="240" tabindex="0" aria-label="Token Hunt game screen"></canvas>
  <canvas id="crtgl" hidden aria-hidden="true"></canvas>
  <div class="crt" id="crt"></div>
  <button id="share" type="button" hidden>SHARE CARD</button>
  <button id="brag" type="button" hidden>COPY TEXT</button>
  <div id="bragtxt" hidden></div>
</div>
<div id="cardbox" hidden role="dialog" aria-label="Share card"><div class="cardwrap"><img id="cardimg" alt="Your Token Hunt result card"><div class="cardhint">LONG-PRESS OR RIGHT-CLICK THE CARD TO SAVE IT</div><button id="cardclose" type="button">CLOSE</button></div></div>
<input id="code" tabindex="-1" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Enter a code" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none">
<div class="foot" id="foot">TAP TO SERVE <span class="keys">&middot; <b>M</b> MUTE &middot; <b>P</b> PAUSE &middot; <b>C</b> CRT</span> &middot; ONE FILE. ZERO ASSETS. ZERO NETWORK REQUESTS.</div>

// Determinism: two seeded streams drive the simulation (G.rng: spawns + flight paths, G.rng2: dialogue, lightning, critic placement);
// fxRng is cosmetic only (particles, rain, shake jitter, chirp pitch) and may differ between a run and its replay.
function makeRng(seed){ let a=seed>>>0; const f=()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; f.get=()=>a; f.set=v=>{ a=v|0; }; return f; }
const fxRng=makeRng(Math.random()*4294967296);
const rnd=(a,b)=>a+fxRng()*(b-a);        // cosmetic
const srnd=(a,b)=>a+G.rng2()*(b-a);      // simulation
const pad=(n,w)=>{ n=n|0; return (n<0?'-':'')+String(Math.abs(n)).padStart(w,'0'); };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ------------------------------------------------------------------ sprites
function bake(rows, mirrorX, flat){
  const w=rows[0].length, h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); const img=x.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++){ const r=rows[y];
    for(let i=0;i<w;i++){ const ch=r[mirrorX? w-1-i : i]; if(ch==='.') continue;
      const n=parseInt((flat||PAL[ch]).slice(1),16); const o=(y*w+i)*4;
      d[o]=n>>16&255; d[o+1]=n>>8&255; d[o+2]=n&255; d[o+3]=255; } }
  x.putImageData(img,0,0); return c;
}
// colour grammar: red is only for things you shoot (agents, boss); a hallucination is a grey static ghost; a 429-frozen request is icy blue
const GHOST='#e6e2f0', ICE='#9fe3ff';
function bakeGhost(rows,mirrorX,seed){ const r=seeded(seed), w=rows[0].length, h=rows.length; const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); const img=x.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){ const ch=rows[y][mirrorX? w-1-i : i]; if(ch==='.') continue; const n=parseInt(PAL[ch].slice(1),16); const lum=0.3*(n>>16&255)+0.59*(n>>8&255)+0.11*(n&255);
    let g=Math.round(110+lum*0.5); const q=r(); if(q<0.12) g=245; else if(q<0.22) g=70; const o=(y*w+i)*4; d[o]=g; d[o+1]=g; d[o+2]=Math.min(255,g+14); d[o+3]=255; }
  x.putImageData(img,0,0); return c; }
function glitchRows(rows,seed){ const r=seeded(seed); return rows.map(row=>row.split('').map(ch=> ch!=='.'&&r()<0.18 ? (r()<0.5?'R':'K') : ch).join('')); }
const S={};
for(const k in SPR){ S[k]=bake(SPR[k]); S[k+'L']=bake(SPR[k],true); S[k+'W']=bake(SPR[k],false,'#ffffff'); S[k+'WL']=bake(SPR[k],true,'#ffffff'); S[k+'R']=bake(SPR[k],false,'#ff4d4d'); S[k+'RL']=bake(SPR[k],true,'#ff4d4d');
  if(/^(lo|hi|bird|gold)\d$/.test(k)){ const sd=k.length*131+k.charCodeAt(2); S[k+'G']=bakeGhost(SPR[k],false,sd); S[k+'GL']=bakeGhost(SPR[k],true,sd);
    S[k+'X']=bake(SPR[k],false,GHOST); S[k+'XL']=bake(SPR[k],true,GHOST); S[k+'I']=bake(SPR[k],false,ICE); S[k+'IL']=bake(SPR[k],true,ICE); } }
const BIRD_FRAMES=[0,1,2,1];
const SHADOW='#1a1420';

function icon(rows,x,y,col){ ctx.fillStyle=col; for(let r=0;r<rows.length;r++) for(let c=0;c<rows[r].length;c++) if(rows[r][c]==='X') ctx.fillRect(x+c,y+r,1,1); }

// ------------------------------------------------------------------ bitmap font (3x5)
const GLY={}; for(const k in FONT) GLY[k]=FONT[k].split(' ');
// 5x7 face for everything the player has to read in a hurry: the critic, tips, rule lines, title copy
const GLY7={}; for(const k in FONT7) GLY7[k]=FONT7[k].split(' ');
function text7(s,x,y,col){ ctx.fillStyle=col; s=String(s).toUpperCase(); let cx=Math.round(x); y=Math.round(y);
  for(const ch of s){ const g=GLY7[ch]||GLY7[' ']||GLY7['?']; if(g) for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(g[r][c]==='1') ctx.fillRect(cx+c,y+r,1,1); cx+=6; } }
const textW7=s=>Math.max(0,String(s).length*6-1);
function text7S(s,x,y,col){ text7(s,x+1,y+1,SHADOW); text7(s,x,y,col); }
function text7Split(s,y,shown){ const i=s.indexOf('->'), x=Math.round(W/2-textW7(s)/2), sh= shown==null? s : s.slice(0,shown); // what it saw in ghost white, what it will do in purple
  if(i<0){ text7S(sh,x,y,GHOST); return; } text7S(sh.slice(0,i),x,y,GHOST); if(sh.length>i) text7S(sh.slice(i),x+6*i,y,'#b99cff'); }
function text7C(s,y,col,shadow){ const x=Math.round(W/2-textW7(s)/2); (shadow?text7S:text7)(s,x,y,col); }
function wrap7(s,maxW){ const words=String(s).split(' '), out=[]; let cur=''; for(const w of words){ const nx=cur?cur+' '+w:w; if(textW7(nx)>maxW&&cur){ out.push(cur); cur=w; } else cur=nx; } if(cur) out.push(cur); return out; }
// the critic's bubble, shared by drawing and the tap-to-dismiss hit test
function bubbleGeom(line,fx,y,catchUp,over){ const L=wrap7(line,228), tw=Math.max(...L.map(textW7))+10, th=L.length*10+3; const bx=clamp(Math.round(fx+16-tw/2),3,W-tw-3);
  const bottom= over? y-3 : y-15-(catchUp?14:0); return {L,tw,th,bx,by:bottom-th}; }
function text(s,x,y,col,sc){ sc=sc||1; ctx.fillStyle=col; s=String(s).toUpperCase(); let cx=x;
  for(const ch of s){ const g=GLY[ch]||GLY[' '];
    for(let r=0;r<5;r++){ const row=g[r]; for(let c=0;c<3;c++) if(row[c]==='1') ctx.fillRect(cx+c*sc,y+r*sc,sc,sc); }
    cx+=4*sc; } }
const textW=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
function textS(s,x,y,col,sc){ sc=sc||1; text(s,x+sc,y+sc,SHADOW,sc); text(s,x,y,col,sc); }
function textC(s,y,col,sc,shadow){ sc=sc||1; const x=Math.round(W/2-textW(s,sc)/2); (shadow?textS:text)(s,x,y,col,sc); }
// 5x7 display face for the title: 6 columns per letter, 2px drop shadow, centered
const BIGG={}; for(const k in BIG) BIGG[k]=BIG[k].split(' ');
function bigText(s,y,col,sc){ const w=s.length*6*sc-sc; let cx=Math.round(W/2-w/2);
  for(let pass=0;pass<2;pass++){ ctx.fillStyle= pass?col:SHADOW; const off=pass?0:2; let x=cx;
    for(const ch of s){ const g=BIGG[ch]; if(g) for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(g[r][c]==='1') ctx.fillRect(x+c*sc+off,y+r*sc+off,sc,sc); x+=6*sc; } } }

// ------------------------------------------------------------------ pixel primitives
function fillEllipse(cx,cy,rx,ry,col){ ctx.fillStyle=col; for(let y=-ry;y<=ry;y++){ const t=1-(y*y)/(ry*ry); if(t<0) continue; const hw=Math.floor(Math.sqrt(t)*rx); ctx.fillRect(cx-hw,cy+y,hw*2+1,1); } }
function seeded(n){ let s=n|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }

// ------------------------------------------------------------------ audio (all synthesized; E3: mixed, not summed)
// graph: voices -> [StereoPanner by screen x] -> sfx | voice bus; music layers -> duck (sidechain) -> music bus; buses -> master (mute)
//        -> DynamicsCompressor (-18 dB, 4:1) -> out. Music ducks -8 dB for 180 ms on hits and when the bot starts speaking.
let ac=null, master=null, comp=null, BUS=null, muted=false, noiseBuf=null, rainNode=null, quiet=false; // quiet: fast-forwarding a replay, no sound
try{ muted=localStorage.getItem('th.muted')==='1'; }catch(e){}
const DUCK=Math.pow(10,-8/20), LAYERS=['base','arp','drums','storm','boss'];
function audioInit(){ if(ac) return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=muted?0:0.5;
    comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4; comp.knee.value=6; comp.attack.value=0.004; comp.release.value=0.2; master.connect(comp); comp.connect(ac.destination);
    const bus=(v,to)=>{ const g=ac.createGain(); g.gain.value=v; g.connect(to||master); return g; };
    BUS={ music:bus(0.9), sfx:bus(1), voice:bus(0.9), ducks:0, pans:0, layer:{} }; BUS.duck=bus(1,BUS.music);
    for(const k of LAYERS) BUS.layer[k]=bus(k==='base'?1:0,BUS.duck);
  }catch(e){ ac=null; BUS=null; } }
function getNoise(){ if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
const panX=x=> x==null||!Number.isFinite(x)? 0 : clamp((x/W)*1.6-0.8,-0.8,0.8);
function route(node,pan,bus){ if(pan&&ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=clamp(pan,-0.8,0.8); node.connect(p); node=p; BUS.pans++; BUS.lastPan=p.pan.value; } node.connect(bus||BUS.sfx); }
// narrow pulse waves (the 2A03's 25% and 12.5% duties), built once from their Fourier series
const PULSE={}; function pulseWave(d){ if(PULSE[d]) return PULSE[d]; const N=48, re=new Float32Array(N), im=new Float32Array(N); for(let n=1;n<N;n++){ re[n]=Math.sin(2*Math.PI*n*d)/(Math.PI*n); im[n]=(1-Math.cos(2*Math.PI*n*d))/(Math.PI*n); } return (PULSE[d]=ac.createPeriodicWave(re,im)); }
function tone(f,dur,type,vol,slideTo,when,pan,bus){ if(!ac||quiet) return; const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(), g=ac.createGain(); if(type==='p25'||type==='p12'){ try{ o.setPeriodicWave(pulseWave(type==='p25'?0.25:0.125)); }catch(e){ o.type='square'; } } else o.type=type||'square';
  o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol==null?0.25:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); route(g,pan,bus); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,vol,when,filterHz,pan,bus,ftype){ if(!ac||quiet) return; const t=ac.currentTime+(when||0);
  const s=ac.createBufferSource(); s.buffer=getNoise(); const g=ac.createGain();
  g.gain.setValueAtTime(vol==null?0.3:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  let node=s; if(filterHz){ const f=ac.createBiquadFilter(); f.type=ftype||'lowpass'; f.frequency.value=filterHz; s.connect(f); node=f; }
  node.connect(g); route(g,pan,bus); s.start(t); s.stop(t+dur+0.02); }
// E9: when muted, a short caption names each meaningful sound in the top-left corner
const CAPS=[]; function caption(t){ if(!muted||quiet) return; CAPS.push({t,at:performance.now()}); if(CAPS.length>3) CAPS.shift(); }
function musicDuck(){ if(!ac||!BUS||quiet) return; const g=BUS.duck.gain, t=ac.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(DUCK,t+0.012); g.setValueAtTime(DUCK,t+0.18); g.linearRampToValueAtTime(1,t+0.3); BUS.ducks++; }
const KEYF=()=> Math.pow(2,(music.semi||0)/12); // stingers follow the loop's key
const SFX={
  shot(x){ const p=panX(x); noise(0.18,0.35,0,1800,p); tone(150,0.12,'square',0.3,60,0,p); },
  flap(x){ const p=panX(x); tone(220,0.04,'square',0.08,null,0,p); tone(270,0.04,'square',0.08,null,0.06,p); },
  hit(m,x){ caption('(DING)'); const p=panX(x), k=Math.pow(2,(2*((m||1)-1))/12); tone(660*k,0.07,'square',0.25,null,0,p); tone(880*k,0.07,'square',0.25,null,0.07,p); tone(1320*k,0.12,'square',0.25,null,0.14,p); musicDuck(); },
  gold(x){ caption('(GOLD CHIME)'); const p=panX(x), k=KEYF(); [1046,1318,1568,2093].forEach((f,i)=>tone(f*k,0.06,'square',0.22,null,i*0.06,p)); musicDuck(); },
  fall(x){ tone(1500,0.7,'triangle',0.22,240,0,panX(x)); },
  thud(x){ const p=panX(x); noise(0.12,0.35,0,400,p); tone(80,0.1,'triangle',0.3,40,0,p); },
  laugh(x){ caption('(BOT LAUGHS)'); const p=panX(x); [520,470,420,380,340].forEach((f,i)=>tone(f,0.09,'square',0.22,null,i*0.11,p,BUS&&BUS.voice)); },
  away(){ caption('(WHOOSH)'); tone(900,0.5,'square',0.15,200); },
  fanfare(){ caption('(FANFARE)'); const k=KEYF(); [392,523,659,784].forEach((f,i)=>tone(f*k,0.12,'square',0.22,null,i*0.12)); tone(1046*k,0.4,'square',0.22,null,0.48); },
  clear(){ caption('(EPOCH CLEAR)'); const k=KEYF(); [523,659,784,1046,784,1046].forEach((f,i)=>tone(f*k,0.11,'square',0.22,null,i*0.11)); },
  perfect(){ caption('(PERFECT!)'); const k=KEYF(); [523,659,784,1046,1318,1568,2093].forEach((f,i)=>tone(f*k,0.08,'square',0.22,null,i*0.07)); tone(2093*k,0.5,'square',0.2,null,0.5); },
  over(){ caption('(GAME OVER JINGLE)'); [440,415,392,370,349,330,311,294].forEach((f,i)=>tone(f,0.16,'triangle',0.25,null,i*0.17)); tone(262,0.9,'triangle',0.25,null,1.4); },
  thunder(when,x){ caption('(THUNDER)'); noise(1.4,0.45,when||0,220,panX(x)); },
  blip(x){ tone(880,0.05,'square',0.15,null,0,panX(x),BUS&&BUS.voice); },
  wrong(x){ caption('(ERROR BUZZ)'); const p=panX(x); tone(220,0.12,'square',0.3,160,0,p); tone(160,0.25,'square',0.3,90,0.12,p); musicDuck(); },
  tick(){ tone(1200,0.03,'square',0.12); },
  rewind(){ caption('(TAPE REWIND)'); tone(1900,0.38,'square',0.09,380); tone(1500,0.38,'square',0.06,300,0.04); },
  chirp(x){ tone(520+fxRng()*420,0.035,'square',0.07,null,0,panX(x),BUS&&BUS.voice); },
};
function rainStart(level){ if(!ac||rainNode||quiet) return; const s=ac.createBufferSource(); s.buffer=getNoise(); s.loop=true;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=level>1?800:1500; f.Q.value=0.6;
  const g=ac.createGain(); g.gain.value=level>1?0.10:0.06; s.connect(f); f.connect(g); g.connect(BUS.sfx); s.start(); rainNode={s,g}; }
function rainStop(){ if(rainNode){ try{ rainNode.s.stop(); }catch(e){} rainNode=null; } }

// After each epoch it reads your habits off your play and builds the next epoch's fakes to exploit them: the colour you serve

  if(s>=2&&Math.floor(s)/s>=0.88) s=Math.floor(s); // integer (pixel-perfect) only when it costs under 12% of the screen; otherwise fill it
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px'; document.documentElement.style.setProperty('--sl',s+'px'); crt.hidden=s<3||crtActive();
  glc.style.width=cv.style.width; glc.style.height=cv.style.height; const dpr=Math.min(2,window.devicePixelRatio||1); let bw=Math.round(W*s*dpr), bh=Math.round(H*s*dpr);
  if(CRT.tier===1&&bw>2*W){ bw=2*W; bh=2*H; } if(glc.width!==bw||glc.height!==bh){ glc.width=bw; glc.height=bh; }
  const ratio=W*s/bw; glc.style.imageRendering= Math.abs(ratio-Math.round(ratio))<0.01? 'pixelated' : 'auto'; }
window.addEventListener('resize',fit); fit();

  if(!G.mouse.on){ G.mouse.x=128; G.mouse.y=90; G.mouse.on=true; } if(!best) return; const k=1-Math.pow(0.8,dt/16.67); G.mouse.x+=(best[0]-G.mouse.x)*k; G.mouse.y+=(best[1]-G.mouse.y)*k; }

  requestAnimationFrame(frame); }

function boot(data){ if(data&&data.hi>G.hi){ G.hi=data.hi; G.hiBoot=data.hi; } if(crtWant) crtInit(); crtApplyDom(); let th='gpu'; try{ th=localStorage.getItem('th.theme')||'gpu'; }catch(e){} if(!THEMES[th]) th='gpu'; applyTheme(th); let df='medium'; try{ df=localStorage.getItem('th.diff')||'medium'; }catch(e){} setDiff(df); requestAnimationFrame(frame); }
