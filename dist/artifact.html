<title>Token Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one 256x240 arcade screen centered on a dark server-room cabinet; the canvas is the page. Deliberately single-theme (arcade). */
:root{
  --cab:#0a0a12;
  --bezel:#262238;
  --ink:#e9e4d8;
  --dim:#8a8494;
  --accent:#3cd0ff;
  --glow:rgba(138,92,245,.18);
  --font-ui:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --sl:4px;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; box-sizing:border-box; background:var(--cab); color:var(--ink);
  font:10px/1.6 var(--font-ui);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.screen{position:relative; line-height:0; max-width:100%}
canvas{
  display:block; max-width:100%;
  image-rendering:pixelated; image-rendering:crisp-edges;
  cursor:crosshair; background:#2a6fd6; border-radius:3px;
  box-shadow:0 0 0 4px #000, 0 0 0 7px var(--bezel), 0 0 48px var(--glow);
}
canvas:focus-visible{outline:2px solid var(--accent); outline-offset:9px}
.crt{
  position:absolute; inset:0; pointer-events:none; border-radius:3px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0, rgba(0,0,0,.20) 1px, transparent 1px, transparent var(--sl));
}
.crt::after{content:""; position:absolute; inset:0; border-radius:3px; box-shadow:inset 0 0 70px rgba(0,0,0,.42)}
.foot{color:var(--dim); font-size:8px; letter-spacing:.06em; text-align:center; line-height:1.9; max-width:60ch}
.foot b{color:var(--accent); font-weight:normal}
#brag{font:8px/1 var(--font-ui); letter-spacing:.06em; color:var(--cab); background:var(--accent); border:0; padding:8px 12px; cursor:pointer; border-radius:2px}
#brag:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
#bragtxt{font:8px/1.8 var(--font-ui); color:var(--ink); user-select:text; -webkit-user-select:text; max-width:60ch; text-align:center; word-break:break-all}
@media (prefers-reduced-motion:reduce){.crt{display:none}}
</style>

<div class="screen">
  <canvas id="g" width="256" height="240" tabindex="0" aria-label="Token Hunt game screen"></canvas>
  <div class="crt" id="crt"></div>
</div>
<input id="code" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Enter a code" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none">
<button id="brag" type="button" hidden>COPY RESULT</button>
<div id="bragtxt" hidden></div>
<div class="foot" id="foot">CLICK / TAP TO SERVE A REQUEST &middot; <b>M</b> MUTE &middot; <b>P</b> PAUSE &middot; ORIGINAL ART &amp; CHIPTUNE, NO ASSETS LOADED</div>

function bake(rows, mirrorX, flat){
  const w=rows[0].length, h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); const img=x.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++){ const r=rows[y];
    for(let i=0;i<w;i++){ const ch=r[mirrorX? w-1-i : i]; if(ch==='.') continue;
      const n=parseInt((flat||PAL[ch]).slice(1),16); const o=(y*w+i)*4;
      d[o]=n>>16&255; d[o+1]=n>>8&255; d[o+2]=n&255; d[o+3]=255; } }
  x.putImageData(img,0,0); return c;
}
function glitchRows(rows,seed){ const r=seeded(seed); return rows.map(row=>row.split('').map(ch=> ch!=='.'&&r()<0.18 ? (r()<0.5?'R':'K') : ch).join('')); }

function text(s,x,y,col,sc){ sc=sc||1; ctx.fillStyle=col; s=String(s).toUpperCase(); let cx=x;
  for(const ch of s){ const g=GLY[ch]||GLY[' '];
    for(let r=0;r<5;r++){ const row=g[r]; for(let c=0;c<3;c++) if(row[c]==='1') ctx.fillRect(cx+c*sc,y+r*sc,sc,sc); }
    cx+=4*sc; } }
const textW=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
function textS(s,x,y,col,sc){ sc=sc||1; text(s,x+sc,y+sc,SHADOW,sc); text(s,x,y,col,sc); }
function textC(s,y,col,sc,shadow){ sc=sc||1; const x=Math.round(W/2-textW(s,sc)/2); (shadow?textS:text)(s,x,y,col,sc); }

function bigText(s,y,col,sc){ const w=s.length*6*sc-sc; let cx=Math.round(W/2-w/2);

    for(const ch of s){ const g=BIGG[ch]; if(g) for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(g[r][c]==='1') ctx.fillRect(x+c*sc+off,y+r*sc+off,sc,sc); x+=6*sc; } } }

function getNoise(){ if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
function tone(f,dur,type,vol,slideTo,when){ if(!ac) return; const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol==null?0.25:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,vol,when,filterHz){ if(!ac) return; const t=ac.currentTime+(when||0);
  const s=ac.createBufferSource(); s.buffer=getNoise(); const g=ac.createGain();
  g.gain.setValueAtTime(vol==null?0.3:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  let node=s; if(filterHz){ const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterHz; s.connect(f); node=f; }
  node.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02); }

  start(){ if(!ac||this.on) return; this.on=true; this.step=0; this.next=ac.currentTime+0.05; this.timer=setInterval(()=>this.tick(),50); },
  stop(){ this.on=false; if(this.timer) clearInterval(this.timer); this.timer=null; },
  tick(){ if(!ac) return; while(this.next<ac.currentTime+0.25){ const i=this.step%64; const l=LEAD[i], b=BASS[i]; const when=Math.max(0,this.next-ac.currentTime);

function line(kind){ const pool=T.lines[kind]||T.lines.miss; let s=pick(pool); if(pool.length>1&&s===G.lastLine) s=pool[(pool.indexOf(s)+1)%pool.length]; G.lastLine=s; return s; }
function toast(txt){ G.toast={txt,t:0}; }

function setWeather(){ G.wx=lvl(G.round); G.windDir=Math.random()<0.5?-1:1;
  G.rain=[]; const n=G.wx.rain===2?130: G.wx.rain===1?70:0; for(let i=0;i<n;i++) G.rain.push({x:rnd(0,W),y:rnd(-20,FRONT),l:G.wx.rain===2&&Math.random()<0.4?5:3});
  G.clouds=[{x:20,y:18,w:3},{x:120,y:36,w:2},{x:200,y:12,w:3}];
  G.nextLightning=200+rnd(0,200); G.lightning=0;
  rainStop(); if(G.wx.rain) rainStart(G.wx.rain); }
setWeather();

function startGame(attract){ G.attract=!!attract; G.round=1; G.score=0; G.cost=0; G.wave=0; G.tally=[]; G.birds=[]; G.fx=[]; G.newRecord=false; G.combo=0; G.streak={hit:0,miss:0}; G.nearMiss=false; setWeather();
  if(G.attract){ G.state='intro'; G.t=0; return; }
  G.state='boot'; G.t=0; G.boot={t:0,line:-1}; }
function bootDone(){ G.state='intro'; G.t=0; SFX.fanfare(); music.start(); }
function beginFirstWave(){ if(!G.seen&&!G.attract){ G.seen=true; try{ localStorage.setItem('th.seen','1'); }catch(e){}
    G.state='fox'; G.fox.t=0; G.fox.mode='tut'; G.fox.count=0; G.fox.line=line('tutorial'); G.fox.x=112; SFX.blip(); } else startWave(); }
function startWave(){ G.state='fly'; G.shots=G.assist?5:D.ammo; G.flightT=0; G.nearMiss=false; G.hallucServed=false; G.hallucEscaped=false; const left=EPOCH_LEN-G.wave; let n=1;
  if(left>=2&&G.round>=D.doublesFrom&&Math.random()<D.doubleP) n=2;
  G.birds=[]; for(let i=0;i<n;i++) G.birds.push(spawnBird(i,n,false)); G.wave+=n;
  if(G.forceHalluc||Math.random()<D.halluc) G.birds.push(spawnBird(n,n+1,true));
  SFX.flap(); }
function spawnBird(i,n,bad){ const tier= bad?'lo' : (Math.random()<TIERS.hi.p?'hi':'lo'); const tr=TIERS[tier];
  let sp=Math.min(3.2,1.25+G.round*0.13)*tr.speed*D.speed; if(G.round===1) sp*=0.85; if(G.assist) sp*=0.75;
  const x= n===1? rnd(60,190) : rnd(30+i*(190/n), 30+(i+1)*(190/n)-24);
  return {x,y:150,vx:(Math.random()<0.5?-1:1)*sp*0.6,vy:-sp,sp,tier,bad:!!bad,st:'fly',f:0,at:0,dirT:bad?rnd(10,25):rnd(tr.dirT[0],tr.dirT[1]),hitT:0}; }
function newDir(b){ const up=Math.random()<0.7||b.y>120; const a= up? 0.3+Math.random()*(Math.PI-0.6) : -(0.35+Math.random()*0.9);
  b.vx=Math.cos(a)*b.sp; b.vy=-Math.sin(a)*b.sp; if(Math.abs(b.vx)<0.45) b.vx=(b.vx<0?-1:1)*0.45; const tr=TIERS[b.tier]; b.dirT= b.bad? rnd(10,25) : rnd(tr.dirT[0],tr.dirT[1]); }

function shoot(x,y){ if(G.state!=='fly'||G.shots<=0) return; G.shots--; G.cost+=COST; SFX.shot(); G.flash=2; G.shake=2; G.muzzle={x,y,t:2};
  let hitAny=false, nearest=999;
  for(const b of G.birds){ if(b.st!=='fly') continue;
    if(x>=b.x-3&&x<=b.x+27&&y>=b.y-3&&y<=b.y+23){ hitAny=true; b.st='hit'; b.hitT=0; G.freeze=3;
      if(b.bad){ G.score=Math.max(0,G.score-500); G.combo=0; G.hallucServed=true; G.shake=5;
        G.fx.push({type:'pts',x:b.x-2,y:b.y-4,t:0,txt:'-500',col:T.fx.badPop,sc:2}); SFX.wrong(); continue; }
      const hi=b.tier==='hi'; G.combo++; const m=comboMult(G.combo); if(m!==comboMult(G.combo-1)) G.comboFlash=10;
      const p=valueOf(b)*m*(G.assist?3:1); G.score+=p; G.tally.push('hit'); G.shake=hi?6:4;
      G.fx.push({type:'pts',x:b.x-2,y:b.y-4,t:0,txt:'+'+p,col:hi?T.fx.hiPop:T.fx.loPop,sc:(hi||m>1)?2:1});
      for(let i=0;i<6;i++) G.fx.push({type:'feather',x:b.x+12,y:b.y+10,vx:rnd(-1,1),vy:rnd(-1.5,0),t:0,col:hi?T.fx.featherHi:T.fx.featherLo});
      if(hi) SFX.gold(); else SFX.hit(); }
    else if(!b.bad){ const d=Math.hypot(x-(b.x+12),y-(b.y+10)); if(d<nearest) nearest=d; } }
  if(!hitAny&&nearest<24) G.nearMiss=true; }

function updateBirds(){ const limit=Math.max(200,460-G.round*18); let flying=0;
  for(const b of G.birds){
    if(b.st==='fly'){ flying++; b.x+=b.vx+G.wind*0.45; b.y+=b.vy; b.dirT--; if(b.dirT<=0) newDir(b);
      if(b.x<0){ b.x=0; b.vx=Math.abs(b.vx); } if(b.x>W-24){ b.x=W-24; b.vx=-Math.abs(b.vx); }
      if(b.y<6){ b.y=6; b.vy=Math.abs(b.vy); } if(b.y>150){ b.y=150; b.vy=-Math.abs(b.vy); }
      b.at++; if(b.at%6===0){ b.f=(b.f+1)&3; if(b.f===0&&Math.random()<0.3) SFX.flap(); } }
    else if(b.st==='hit'){ b.hitT++; if(b.hitT>=22){ b.st='fall'; b.at=0; SFX.fall(); } }
    else if(b.st==='fall'){ b.y+=2.5; b.x+=Math.sin(b.at/5)*0.8; b.at++; if(b.y>=GROUND-6){ b.st='landed'; SFX.thud(); b.lx=b.x;
      for(let i=0;i<8;i++) G.fx.push({type:'puff',x:b.x+8+rnd(0,8),y:GROUND,vx:rnd(-1.2,1.2),vy:rnd(-2,-0.5),t:0,col:T.fx.puff}); } }
    else if(b.st==='away'){ b.y-=3.5; b.at++; if(b.at%3===0) b.f=(b.f+1)&3; if(b.y<-26){ b.st='gone'; if(b.bad) G.hallucEscaped=true; else G.tally.push('miss'); } } }
  G.flightT++;
  if(flying&&(G.shots===0||G.flightT>=limit)){ let any=false, real=false; for(const b of G.birds) if(b.st==='fly'){ b.st='away'; b.at=0; any=true; if(!b.bad) real=true; } if(any){ SFX.away(); if(real) G.combo=0; } }
  if(G.birds.every(b=>b.st==='landed'||b.st==='gone')){ const hits=G.birds.filter(b=>b.st==='landed'&&!b.bad); const n=hits.length;
    if(n){ G.streak.hit+=n; G.streak.miss=0; } else { G.streak.miss++; G.streak.hit=0; }
    G.state='fox'; G.fox.t=0; G.fox.count=n; G.fox.mode=n?'hit':'miss';
    G.fox.line= G.cheatPending? (G.cheatPending=false, line('cheatFirst')) : G.hallucServed? line('hallucServed') : !n&&G.nearMiss? line('nearMiss') : !n&&G.streak.miss>=3? line('miss3') : n&&G.streak.hit>=3? line('hit3') : n>=2? line('hit2') : n? line('hit') : G.hallucEscaped? line('hallucEscaped') : line('miss');
    G.fox.x=clamp(Math.round(n? hits[0].lx-4 : rnd(40,180)),8,216); if(G.hallucServed||!n) SFX.laugh(); else SFX.blip(); } }

function endRound(){ const hits=G.tally.filter(t=>t==='hit').length; const need=req(G.round);
  if(hits>=need){ G.state='roundEnd'; G.t=0; G.perfect=hits===EPOCH_LEN; if(G.perfect){ G.score+=10000; SFX.perfect(); } else SFX.clear(); }
  else { G.state='gameOver'; G.t=0; music.stop(); rainStop(); SFX.over(); G.fox.mode='miss'; G.fox.t=0; G.fox.x=112; G.fox.line=line('over');
    if(!G.attract){ if(G.assist){ if(G.score>G.hiA){ G.hiA=G.score; G.newRecord=true; try{ localStorage.setItem('th.hiAssist',String(G.hiA)); }catch(e){} } }
      else if(G.score>G.hi){ G.hi=G.score; G.newRecord=true; try{ localStorage.setItem('th.hi',String(G.hi)); }catch(e){} } }
    showBrag(); } }
function toTitle(){ G.attract=false; G.state='title'; G.t=0; G.idle=0; G.round=1; G.score=0; G.cost=0; G.wave=0; G.tally=[]; G.birds=[]; G.fx=[]; G.combo=0; G.shots=G.assist?5:D.ammo; G.mouse.on=false; setWeather(); hideBrag(); }
function attractAI(){ if(G.state!=='fly') return; G.aim.t++; const b=G.birds.find(b=>b.st==='fly'&&!b.bad); if(!b) return;
  const tx=b.x+12+b.vx*6+Math.sin(G.aim.t/9)*6, ty=b.y+10+b.vy*6+Math.cos(G.aim.t/7)*5; G.aim.x+=(tx-G.aim.x)*0.25; G.aim.y+=(ty-G.aim.y)*0.25; G.mouse.x=G.aim.x; G.mouse.y=G.aim.y; G.mouse.on=true;
  if(G.aim.t%30===0&&G.shots>0&&G.flightT>20) shoot(G.aim.x+rnd(-7,7),G.aim.y+rnd(-7,7)); }
function nextRound(){ G.round++; G.wave=0; G.tally=[]; G.birds=[]; setWeather(); G.state='intro'; G.t=0; SFX.fanfare(); }

const PAUSABLE={intro:1,fly:1,fox:1,gap:1};
function setPaused(p){ if(p&&!PAUSABLE[G.state]) return; if(G.paused===p) return; G.paused=p;
  if(p){ music.stop(); rainStop(); } else { music.start(); if(G.wx.rain) rainStart(G.wx.rain); } }

function handleTap(x,y){
  if(G.paused){ setPaused(false); return; }
  if(G.attract){ toTitle(); return; }
  G.idle=0;
  switch(G.state){
    case 'title': if(logoTap(x,y)) return; if(!titleTap(x,y)) startGame(); break;
    case 'boot': if(G.boot.t>40) bootDone(); break;
    case 'fly': shoot(x,y); break;
    case 'roundEnd': if(G.t>50) nextRound(); break;
    case 'gameOver': if(G.t>70){ hideBrag(); if(x>=44&&x<=92&&y>=104&&y<=118) toTitle(); else startGame(); } break;
  } }
// 7 taps on the logo within 4 s opens the keyboard for code entry (mobile has no keys)
const codeInput=document.getElementById('code');
function logoTap(x,y){ if(y>70) return false; const now=performance.now(); G.taps=G.taps.filter(t=>now-t<4000); G.taps.push(now);
  if(G.taps.length>=7){ G.taps=[]; codeInput.style.pointerEvents='auto'; codeInput.value=''; codeInput.focus(); toast('TYPE A CODE'); setTimeout(()=>codeInput.blur(),6000); return true; } return false; }
codeInput.addEventListener('input',()=>{ const v=codeInput.value.toLowerCase().replace(/[^a-z]/g,''); codeInput.value=''; for(const ch of v) feedKey(ch); });
codeInput.addEventListener('blur',()=>{ codeInput.style.pointerEvents='none'; });
const CODES={ duck(){ applyTheme('duck'); toast('SKIN: '+T.skinName); }, token(){ applyTheme('gpu'); toast('SKIN: '+T.skinName); },
  finn(){ toggleAssist(); }, vcc(){ toggleAssist(); } };
function toggleAssist(){ G.assist=!G.assist; if(G.assist){ G.cheatPending=true; toast('ASSISTED MODE: 3X'); SFX.gold(); } else { toast('ASSISTED MODE OFF'); SFX.blip(); } }
function feedKey(ch){ G.keys=(G.keys+ch).slice(-8); for(const c in CODES) if(G.keys.endsWith(c)){ G.keys=''; CODES[c](); break; } }
// brag line (A11)
const bragBtn=document.getElementById('brag'), bragTxt=document.getElementById('bragtxt');
function bragText(){ return T.titleA+' '+T.titleB+' · '+T.banners.unit+' '+G.score.toLocaleString()+' · '+T.hud.round+' '+G.round+' · '+T.banners.over+(G.assist?' · ASSISTED RUN':'')+' · '+location.href; }
function showBrag(){ if(G.attract) return; bragBtn.hidden=false; bragTxt.hidden=true; }
function hideBrag(){ bragBtn.hidden=true; bragTxt.hidden=true; }
bragBtn.addEventListener('click',()=>{ const t=bragText(); const fail=()=>{ bragTxt.textContent=t; bragTxt.hidden=false; bragBtn.hidden=true; };
  try{ navigator.clipboard.writeText(t).then(()=>toast('COPIED'),fail); }catch(e){ fail(); } });

// ------------------------------------------------------------------ update
function update(){
  if(G.toast){ G.toast.t++; if(G.toast.t>90) G.toast=null; }
  if(G.paused) return;
  if(G.freeze>0){ G.freeze--; return; }
  G.t++;
  const base=G.wx.wind*G.windDir; G.wind= G.wx.gust? base*Math.sin(G.t/70) : base;
  for(const c of G.clouds){ c.x+=0.06+G.wind*0.5; if(c.x>W+40) c.x=-60; if(c.x<-60) c.x=W+40; }
  for(const d of G.rain){ d.y+=G.wx.rain===2?5:4; d.x+=G.wind*1.3; if(d.y>FRONT){ d.y=rnd(-20,-2); d.x=rnd(-10,W+10); } if(d.x<-12) d.x=W+10; if(d.x>W+12) d.x=-10; }
  if(G.wx.storm&&G.state!=='title'){ if(G.lightning>0) G.lightning--; G.nextLightning--; if(G.nextLightning<=0){ G.lightning=3; G.boltX=rnd(30,226); G.nextLightning=220+rnd(0,260); SFX.thunder(0.35); if(T.boltLabel) G.fx.push({type:'pts',x:clamp(G.boltX-6,4,230),y:rnd(20,60),t:0,txt:T.boltLabel,col:'#ff4d4d',sc:1}); } }
  if(G.flash>0) G.flash--; if(G.shake>0) G.shake--; if(G.comboFlash>0) G.comboFlash--; if(G.muzzle&&--G.muzzle.t<=0) G.muzzle=null;
  if(G.attract){ attractAI(); if(G.state==='gameOver'||G.state==='roundEnd'){ if(G.t>120) toTitle(); } }
  switch(G.state){
    case 'title': G.amb.x+=1.1; if(G.amb.x>W+10){ G.amb.x=-40; G.amb.y=rnd(20,90); } G.amb.t++; G.titleFox=(G.titleFox+1)%420;
      G.idle++; if(G.idle>=540&&!G.attract) startGame(true); break;
    case 'boot': G.boot.t++; { const li=Math.min(T.boot.length-1,Math.floor(G.boot.t/22)); if(li!==G.boot.line){ G.boot.line=li; SFX.tick(); } if(G.boot.t>=T.boot.length*22+40) bootDone(); } break;
    case 'intro': if(G.t>=130){ if(G.wave===0&&G.round===1) beginFirstWave(); else startWave(); } break;
    case 'fly': updateBirds(); break;
    case 'fox': G.fox.t++; { const k=G.fox.t-16; if(k>=0&&k<G.fox.line.length&&(k&1)===0&&G.fox.line[k]!==' ') SFX.chirp(); }
      if(G.fox.mode==='tut'){ if(G.fox.t>=100) startWave(); break; }
      if(G.fox.t>=110){ if(G.wave>=EPOCH_LEN) endRound(); else { G.state='gap'; G.t=0; } } break;
    case 'gap': if(G.t>=24) startWave(); break;
    case 'roundEnd': if(G.t>=300) nextRound(); break;
    case 'gameOver': G.fox.t++; break;
  }
  for(const f of G.fx){ f.t++; if(f.type==='pts') f.y-=0.7; else { f.x+=f.vx; f.y+=f.vy; f.vy+=0.12; } }
  G.fx=G.fx.filter(f=> f.t< (f.type==='pts'?48: f.type==='feather'?40:22)); }

// ------------------------------------------------------------------ draw
function drawSky(){ const wx=G.wx; ctx.fillStyle=wx.sky; ctx.fillRect(0,0,W,SKY_H);
  if(wx.dusk){ const d=T.dusk; ctx.fillStyle=d.band1; ctx.fillRect(0,0,W,70); ctx.fillStyle=d.band2; ctx.fillRect(0,70,W,40); fillEllipse(206,138,13,13,d.sun1); fillEllipse(206,138,10,10,d.sun2); }
  if(G.lightning>0){ ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(0,0,W,SKY_H); }
  if(G.state==='fly'&&G.birds.some(b=>b.st==='away')){ ctx.fillStyle=T.banners.escapedTint; ctx.fillRect(0,0,W,GROUND); }
  for(const c of G.clouds){ const x=Math.round(c.x), y=c.y; const col=wx.cloud; fillEllipse(x,y+6,14*c.w/3+6,5,col); fillEllipse(x-8,y+5,8,6,col); fillEllipse(x+6,y+2,10,7,col); fillEllipse(x+14,y+6,7,5,col); }
  if(G.lightning>0){ ctx.fillStyle='#fff6c8'; let x=G.boltX,y=0; const r=seeded(G.boltX*7+G.t); for(let i=0;i<7;i++){ const nx=x+(r()-0.5)*26, ny=y+rnd(14,24); const steps=Math.max(Math.abs(nx-x),Math.abs(ny-y))|0; for(let s=0;s<=steps;s++){ ctx.fillRect(Math.round(x+(nx-x)*s/steps),Math.round(y+(ny-y)*s/steps),2,2); } x=nx;y=ny; if(y>150) break; } } }

function rack(x,y,w,h,rows,seed){ ctx.fillStyle=SHADOW; ctx.fillRect(x,y,w,h); ctx.fillStyle='#3a3550'; ctx.fillRect(x+1,y+1,w-2,h-2);
  const r=seeded(seed); const rh=Math.floor((h-4)/rows);
  for(let i=0;i<rows;i++){ const yy=y+2+i*rh; ctx.fillStyle='#262238'; ctx.fillRect(x+2,yy,w-4,rh-1); ctx.fillStyle='#4a4466'; ctx.fillRect(x+3,yy+1,w-6,1);
    const n=Math.max(1,Math.floor((w-8)/4)); for(let k=0;k<n;k++){ const ph=Math.floor(r()*60); const on=((G.t+ph)>>4)&1; const bad=r()<0.08; ctx.fillStyle= on? (bad?'#ff4d4d':'#39d353') : '#1f3a26'; ctx.fillRect(x+4+k*4,yy+rh-3,2,1); } } }
function drawDatacenter(){ const wx=G.wx; const dark=wx.storm||wx.rain||wx.dusk;
  ctx.fillStyle= dark?'#1b1a2c':'#1f2340'; const r0=seeded(3); let x=0; while(x<W){ const w=10+Math.floor(r0()*18), h=8+Math.floor(r0()*18); ctx.fillRect(x,GROUND-h,w,h); x+=w+1+Math.floor(r0()*3); }
  rack(18,96,30,74,8,11); rack(206,132,38,38,4,29);
  ctx.fillStyle=wx.floor; ctx.fillRect(0,GROUND,W,FRONT-GROUND);
  ctx.fillStyle= dark?'#1c1f30':'#232739'; for(let gx=0;gx<W;gx+=16) ctx.fillRect(gx,GROUND,1,FRONT-GROUND); ctx.fillRect(0,GROUND+10,W,1);
  ctx.fillStyle='#3cd0ff'; ctx.fillRect(0,GROUND+4,W,1); ctx.fillStyle='#8a5cf5'; ctx.fillRect(0,GROUND+6,W,1); }
function drawRackRow(){ ctx.fillStyle=SHADOW; ctx.fillRect(0,FRONT,W,SKY_H-FRONT); ctx.fillStyle='#2e2a44'; ctx.fillRect(0,FRONT+1,W,SKY_H-FRONT-1);
  const r=seeded(99); for(let x=2;x<W;x+=12){ ctx.fillStyle='#1f1c30'; ctx.fillRect(x,FRONT+3,9,6); const ph=Math.floor(r()*60); const on=((G.t+ph)>>3)&1; ctx.fillStyle= on?'#39d353':'#1f3a26'; ctx.fillRect(x+2,FRONT+7,2,1); ctx.fillStyle=((G.t+ph*3)>>5)&1?'#3cd0ff':'#1a3a4a'; ctx.fillRect(x+5,FRONT+7,2,1); } }
function drawMeadow(){ const wx=G.wx; const dark=wx.storm||wx.rain||wx.dusk;
  ctx.fillStyle= dark? '#2a5e2c':'#3f8a40'; for(let x=0;x<W;x++){ const y=152+Math.round(Math.sin(x/23)*4+Math.sin(x/9+2)*2); ctx.fillRect(x,y,1,GROUND-y); }
  ctx.fillStyle='#5a2e18'; ctx.fillRect(28,118,7,52); ctx.fillStyle='#7a4324'; ctx.fillRect(30,118,2,52);
  const c1= dark?'#1f5a28':'#2d7a33', c2= dark?'#2a6e32':'#3f9a3c', c3= dark?'#3a8a3e':'#5cc250';
  fillEllipse(31,108,23,15,c1); fillEllipse(22,100,14,12,c2); fillEllipse(40,96,16,13,c2); fillEllipse(31,86,13,11,c2); fillEllipse(27,84,7,5,c3); fillEllipse(43,94,6,4,c3); fillEllipse(19,99,5,3,c3);
  fillEllipse(222,164,22,8,c1); fillEllipse(212,158,11,8,c2); fillEllipse(228,156,13,10,c2); fillEllipse(240,162,9,6,c2); fillEllipse(226,152,6,3,c3); fillEllipse(211,155,4,2,c3);
  ctx.fillStyle=wx.grass; ctx.fillRect(0,GROUND,W,FRONT-GROUND);
  const r=seeded(7); ctx.fillStyle= dark?'#4aa548':'#6fd36a'; for(let i=0;i<60;i++){ const x=Math.floor(r()*W), y=GROUND+Math.floor(r()*18); ctx.fillRect(x,y,1,2); }
  ctx.fillStyle= dark?'#1c4a20':'#2d7a33'; for(let i=0;i<40;i++){ const x=Math.floor(r()*W), y=GROUND+2+Math.floor(r()*16); ctx.fillRect(x,y,2,1); } }
function drawMeadowFront(){ const dark=G.wx.storm||G.wx.rain||G.wx.dusk; ctx.fillStyle= dark?'#1f5a28':'#2d7a33'; ctx.fillRect(0,FRONT,W,SKY_H-FRONT);
  const r=seeded(99); ctx.fillStyle= dark?'#2f7a34':'#3f9a3c'; for(let i=0;i<70;i++){ const x=Math.floor(r()*W); const h=2+Math.floor(r()*4); ctx.fillRect(x,FRONT-h+1,1,h); } }
const SCENERY={ datacenter:[drawDatacenter,drawRackRow], meadow:[drawMeadow,drawMeadowFront] };

function drawBird(b){ const left=b.vx<0; let key, img; const hi=b.tier==='hi';
  if(b.st==='fall'||b.st==='landed'){ key=b.bad?T.spr.fallBad: hi?T.spr.fallHi:T.spr.fall; img=S[key]; ctx.drawImage(img, Math.round(b.x+4), Math.round(b.y)); return; }
  key=(hi?T.spr.flyHi:T.spr.fly)[b.st==='hit'?1:BIRD_FRAMES[b.f]];
  if(b.st==='hit'&&(b.hitT>>1)%2===1) key+='W'; else if(b.bad&&((b.at>>2)&1)) key+='G';
  img=S[key+(left?'L':'')]; ctx.drawImage(img, Math.round(b.x), Math.round(b.y));
  if(b.bad&&b.st==='fly'){ const tags=T.fx.glitchTags; textS(tags[(b.at/10|0)%tags.length],Math.round(b.x+5),Math.round(b.y-7),T.fx.badPop,1); } }

function drawFox(){ const f=G.fox; let y; const t=f.t;
  if(t<18) y=SKY_H-Math.round(t/18*44); else if(t<92) y=SKY_H-44; else y=SKY_H-44+Math.round((t-92)/18*44);
  if(G.state==='gameOver') y=SKY_H-44;
  const miss=f.mode==='miss'; const tut=f.mode==='tut'; const bob= ((t>>3)&1)?1:0;
  const img= miss? (((t>>4)&1)?S[T.spr.criticFlat]:S[T.spr.critic]) : (((t>>3)&1)?S[T.spr.criticHappy]:S[T.spr.critic]);
  ctx.drawImage(img, f.x, y+bob);
  const catchUp=!miss&&!tut&&T.showCatch&&f.count>0&&t>=14;
  if(catchUp){ const lift=Math.min(8,t-14); const py=y-12-lift; ctx.drawImage(S[T.spr.fall], f.x+8, py); if(f.count>=2) ctx.drawImage(S[T.spr.fall], f.x+22, py+2); }
  if(t>=16&&(t<92||tut)||G.state==='gameOver'){ const shown= G.state==='gameOver'? f.line : f.line.slice(0,Math.max(1,t-16)); const tw=textW(f.line,1)+8; let bx=clamp(Math.round(f.x+16-tw/2),4,W-tw-4); const by=y-26-(catchUp?14:0);
    ctx.fillStyle='#f7f4e9'; ctx.fillRect(bx,by,tw,11); ctx.fillStyle=SHADOW; ctx.fillRect(bx+1,by+11,tw-2,1); ctx.fillRect(bx+tw,by+1,1,10);
    text(shown,bx+4,by+3,SHADOW,1); } }

function drawRain(){ if(!G.wx.rain) return; ctx.fillStyle= G.wx.rain===2?T.rainHi:T.rainLo; for(const d of G.rain){ ctx.fillRect(Math.round(d.x),Math.round(d.y),1,d.l); } }

function drawFx(){ for(const f of G.fx){ if(f.type==='pts'){ if(f.t<40||(f.t&2)) textS(f.txt,Math.round(f.x),Math.round(f.y),f.col,f.sc||1); } else { ctx.fillStyle=f.col; ctx.fillRect(Math.round(f.x),Math.round(f.y),2,2); } }
  if(G.muzzle){ const m=G.muzzle, x=Math.round(m.x), y=Math.round(m.y); ctx.fillStyle='#fff6c8'; for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.fillRect(x+Math.round(Math.cos(a)*5),y+Math.round(Math.sin(a)*5),2,2); ctx.fillRect(x+Math.round(Math.cos(a)*8),y+Math.round(Math.sin(a)*8),1,1); } } }

function drawHUD(){ ctx.fillStyle=SHADOW; ctx.fillRect(0,SKY_H,W,H-SKY_H); ctx.fillStyle='#0a0a12'; ctx.fillRect(0,SKY_H,W,1);
  const lab='#8a8494', ink='#f7f4e9', h=T.hud; const hits=G.tally.filter(t=>t==='hit').length, need=req(G.round);
  text(h.ammo,10,205,lab); const na=G.assist?5:D.ammo; for(let i=0;i<na;i++) icon(ICON[T.ammoIcon],10+i*7,213,i<G.shots?T.css.accent:'#3a344c');
  text(h.served+' '+hits+'/'+EPOCH_LEN+'  '+h.need+' '+need,66,205,lab);
  for(let i=0;i<EPOCH_LEN;i++){ const s=G.tally[i]; ctx.fillStyle= s==='hit'?'#39d353': s==='miss'?'#ff4d4d':'#3a344c'; ctx.fillRect(66+i*11,213,9,5); }
  const glow= hits===need-1 && ((G.t>>3)&1); ctx.fillStyle= glow?'#fff6c8':'#f2c438'; ctx.fillRect(66+need*11-2,glow?211:212,1,glow?9:7);
  const m=comboMult(G.combo); if(m>1){ const flash=G.comboFlash>0&&((G.comboFlash>>1)&1); textS('X'+m,150,205,flash?'#fff6c8':'#ffe98a',flash?2:1); }
  text(h.score,204,205,lab); if(D.mult!==1) text('X'+D.mult,232,205,'#ffe98a'); text(pad(G.score,6),204,213,ink); text(h.cost+' -'+pad(G.cost,5),204,221,'#5a5468');
  text(h.round+' '+pad(G.round,2)+' '+D.tag,10,229,lab); text(G.wx.name,66,229,h.levelColor); if(G.assist) text('ASSIST 3X',130,229,'#ffe98a'); text(h.best+' '+pad(G.assist?G.hiA:G.hi,6),204,229,lab); }

const fmt=(s,m)=>s.replace('%R',pad(G.round,2)).replace('%L',G.wx.name).replace('%N',String(req(G.round))).replace('%E',String(EPOCH_LEN)).replace('%H',String(m||0));
function drawBanner(){ const t=G.t, B=T.banners;
  if(G.state==='intro'){ if(t<110||(t&4)){ textC(T.hud.round+' '+pad(G.round,2),52,'#f7f4e9',2,true); textC(B.load+G.wx.name,74,'#ffe98a',1,true); textC(G.wx.tag,84,'#bdeeff',1,true); textC(fmt(B.quota),96,'#f7f4e9',1,true); } }
  if(G.state==='fly'&&G.birds.some(b=>b.st==='away')) textC(B.escaped,64,'#f7f4e9',2,true);
  if(G.state==='roundEnd'){ panel(44,62,168,74); textC(fmt(B.clear),74,'#ffe98a',1); const hits=G.tally.filter(x=>x==='hit').length;
    textC(fmt(B.served,hits)+'  '+T.hud.net+' '+pad(Math.max(0,G.score-G.cost),6),90,'#f7f4e9',1); if(G.perfect){ if((t>>2)&1) textC(B.perfect,106,'#ffe98a',1); } else textC(fmt(B.survived),106,'#bdeeff',1);
    if(t>50&&((t>>4)&1)) textC('TAP TO CONTINUE',122,'#8a8494',1); }
  if(G.state==='gameOver'){ panel(44,38,168,84); textC(B.over,48,B.overColor,2); if(G.assist) textC('ASSISTED RUN 3X',62,'#ffe98a',1);
    textC(B.unit+' '+pad(G.score,6)+'  '+T.hud.net+' '+pad(Math.max(0,G.score-G.cost),6),74,'#f7f4e9',1);
    if(G.newRecord){ if((t>>2)&1) textC('NEW BEST!',88,'#ffe98a',1); } else textC(T.hud.best+' '+pad(G.assist?G.hiA:G.hi,6),88,'#8a8494',1);
    if(t>70){ if((t>>4)&1) textC(T.restart,104,'#8a8494',1); text('MENU',50,108,'#8a8494',1); } }
  if(G.state==='boot'){ ctx.fillStyle='#07070c'; ctx.fillRect(0,0,W,SKY_H); const n=Math.min(T.boot.length,Math.floor(G.boot.t/22)+1);
    for(let i=0;i<n;i++){ const full=i<n-1||G.boot.t%22>14; const ln=T.boot[i]; text(full?ln:ln.slice(0,Math.floor((G.boot.t%22)/14*ln.length)),16,20+i*14,i===n-1?'#f7f4e9':'#8a8494',1); }
    if((G.boot.t>>3)&1) text('_',16+textW(T.boot[Math.min(n-1,T.boot.length-1)],1)+2,20+(n-1)*14,'#f7f4e9',1);
    const pw=Math.round(clamp(G.boot.t/(T.boot.length*22),0,1)*200); ctx.fillStyle='#3a344c'; ctx.fillRect(16,120,200,6); ctx.fillStyle=T.css.accent; ctx.fillRect(16,120,pw,6);
    if(G.boot.t>40&&((G.boot.t>>4)&1)) text('TAP TO SKIP',16,134,'#5a5468',1); }
  if(G.attract&&G.state!=='title'&&((t>>4)&1)) textC('DEMO  -  TAP TO PLAY',6,'#ffe98a',1,true);
  if(G.paused){ panel(68,80,120,44); textC('PAUSED',90,'#f7f4e9',2); textC('TAP TO RESUME',110,'#8a8494',1); }
  if(G.toast&&(G.toast.t<70||(G.toast.t&2))) textC(G.toast.txt,180,'#ffe98a',1,true); }
function panel(x,y,w,h){ ctx.fillStyle=SHADOW; ctx.fillRect(x,y,w,h); ctx.fillStyle='#f7f4e9'; ctx.fillRect(x+2,y+2,w-4,1); ctx.fillRect(x+2,y+h-3,w-4,1); ctx.fillRect(x+2,y+2,1,h-4); ctx.fillRect(x+w-3,y+2,1,h-4); }

function drawTitle(){ const t=G.t;
  const f=BIRD_FRAMES[(G.amb.t/6|0)&3]; ctx.drawImage(S[(T.spr.amb||T.spr.fly)[f]], Math.round(G.amb.x), Math.round(G.amb.y));
  const ft=G.titleFox; if(ft<200){ let y; if(ft<18) y=SKY_H-Math.round(ft/18*40); else if(ft<180) y=SKY_H-40; else y=SKY_H-40+Math.round((ft-180)/20*40);
    ctx.drawImage(((ft>>4)&1)?S[T.spr.criticHappy]:S[T.spr.critic],214,y); }
  bigText(T.titleA,22,'#f7f4e9',3); bigText(T.titleB,48,T.titleColor,3);
  textC(T.tagline[0],84,SHADOW,1); textC(T.tagline[0],83,'#f7f4e9',1);
  textC(T.tagline[1],94,'#f7f4e9',1,true);
  textC(T.howto[0],110,'#bdeeff',1,true); textC(T.howto[1],120,'#e2ccff',1,true);
  textC(T.howto[2],130,'#ff9a9a',1,true);
  // difficulty row
  let x=52; for(const id of DIFF_ORDER){ const d=DIFFS[id], sel=id===G.diff; const w=textW(d.label,1); const cx=x+28-w/2;
    if(sel){ textS('>',Math.round(cx-8),143,T.titleColor,1); textS('<',Math.round(cx+w+5),143,T.titleColor,1); }
    textS(d.label,Math.round(cx),143,sel?T.titleColor:'#8a8494',1); x+=56; }
  if((t>>4)&1) textC(T.start,158,'#f7f4e9',2,true); }
function titleTap(x,y){ if(y>=138&&y<=152){ const i=clamp(Math.floor((x-52)/56),0,2); setDiff(DIFF_ORDER[i]); SFX.blip(); return true; } return false; }

function drawCrosshair(){ if(!G.mouse.on||G.state!=='fly'||G.paused) return; const x=Math.round(G.mouse.x), y=Math.round(G.mouse.y);
  ctx.fillStyle=SHADOW; ctx.fillRect(x-7,y-1,15,3); ctx.fillRect(x-1,y-7,3,15);
  ctx.fillStyle= G.shots?'#f7f4e9':'#ff4d4d'; ctx.fillRect(x-6,y,4,1); ctx.fillRect(x+3,y,4,1); ctx.fillRect(x,y-6,1,4); ctx.fillRect(x,y+3,1,4); }
function drawIcons(){ // pause (229,2) + mute (243,2)
  ctx.fillStyle=SHADOW; ctx.fillRect(229,2,11,9); ctx.fillStyle=PAUSABLE[G.state]?'#f7f4e9':'#8a8494'; ctx.fillRect(232,4,2,5); ctx.fillRect(236,4,2,5);
  ctx.fillStyle=SHADOW; ctx.fillRect(243,2,11,9); ctx.fillStyle=muted?'#8a8494':'#f7f4e9'; ctx.fillRect(245,5,2,3); ctx.fillRect(247,4,1,5); ctx.fillRect(248,3,1,7);
  if(muted){ ctx.fillStyle='#ff4d4d'; ctx.fillRect(250,4,1,1); ctx.fillRect(251,5,1,1); ctx.fillRect(252,6,1,1); ctx.fillRect(252,4,1,1); ctx.fillRect(250,6,1,1); } else { ctx.fillRect(250,5,1,3); ctx.fillRect(252,4,1,5); } }

function draw(){ ctx.save(); if(G.shake>0&&!G.paused) ctx.translate(rnd(-1,1)|0,rnd(-1,1)|0);
  const [back,front]=SCENERY[T.scenery];
  drawSky(); back();
  if(G.state==='title') drawTitle();
  else { const foxUp=G.state==='fox'||G.state==='gameOver'; for(const b of G.birds) if(b.st!=='gone'&&!(foxUp&&b.st==='landed')) drawBird(b); if(foxUp) drawFox(); }
  front(); drawRain(); drawFx(); ctx.restore();
  if(G.flash>0){ ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(0,0,W,SKY_H); }
  drawBanner(); drawHUD(); drawCrosshair(); drawIcons(); }

// ------------------------------------------------------------------ input
const TOUCH_LIFT=18; // finger offset so the thumb doesn't hide the target
function pos(e){ const r=cv.getBoundingClientRect(); const touch=e.pointerType==='touch'; return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height-(touch?TOUCH_LIFT:0), touch}; }
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.focus({preventScroll:true}); audioInit(); if(ac&&ac.state==='suspended') ac.resume(); const p=pos(e);
  const rawY=p.y+(p.touch?TOUCH_LIFT:0);
  if(rawY<=13&&p.x>=240){ toggleMute(); return; } if(rawY<=13&&p.x>=226&&p.x<240){ setPaused(!G.paused); return; }
  G.mouse.x=p.x; G.mouse.y=p.y; G.mouse.on=true; G.mouse.touch=p.touch; handleTap(p.x,p.y); });
cv.addEventListener('pointermove',e=>{ const p=pos(e); G.mouse.x=p.x; G.mouse.y=p.y; G.mouse.on=true; G.mouse.touch=p.touch; });
cv.addEventListener('pointerleave',()=>{ G.mouse.on=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{ const k=e.key; if(document.activeElement===codeInput) return; if(k.length===1&&/[a-z]/i.test(k)) feedKey(k.toLowerCase()); if(G.state==='title') G.idle=0; if(G.attract&&(k===' '||k==='Enter')){ toTitle(); e.preventDefault(); return; }
  if(G.state==='title'&&(k==='1'||k==='2'||k==='3')){ setDiff(DIFF_ORDER[+k-1]); SFX.blip(); return; }
  if(G.state==='title'&&(k==='ArrowLeft'||k==='ArrowRight')){ const i=DIFF_ORDER.indexOf(G.diff); setDiff(DIFF_ORDER[clamp(i+(k==='ArrowRight'?1:-1),0,2)]); SFX.blip(); e.preventDefault(); return; }
  if(k==='m'||k==='M') toggleMute();
  else if(k==='p'||k==='P'||k==='Escape'){ setPaused(!G.paused); e.preventDefault(); }
  else if(k===' '||k==='Enter'){ if(G.paused) setPaused(false); else if(G.state!=='fly'){ audioInit(); handleTap(-100,-100); } e.preventDefault(); } });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPaused(true); });
window.addEventListener('blur',()=>setPaused(true));

// ------------------------------------------------------------------ sizing
function fit(){ const vw=Math.max(200,window.innerWidth-32), vh=Math.max(200,window.innerHeight-80); let s=Math.min(vw/W,vh/H); if(s>=2) s=Math.floor(s);
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px'; document.documentElement.style.setProperty('--sl',s+'px'); crt.hidden=s<3; }
window.addEventListener('resize',fit); fit();

// ------------------------------------------------------------------ loop (fixed 60 Hz)
let last=performance.now(), acc=0; const STEP=1000/60;
function frame(now){ acc+=Math.min(100,now-last); last=now; while(acc>=STEP){ update(); acc-=STEP; } draw(); requestAnimationFrame(frame); }
function boot(data){ if(data&&data.hi>G.hi) G.hi=data.hi; let th='gpu'; try{ th=localStorage.getItem('th.theme')||'gpu'; }catch(e){} if(!THEMES[th]) th='gpu'; applyTheme(th); let df='medium'; try{ df=localStorage.getItem('th.diff')||'medium'; }catch(e){} setDiff(df); requestAnimationFrame(frame); }
try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({hi:G.hi})); }catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
window.__th=G; window.__applyTheme=applyTheme; window.__T=()=>T; window.__audio=()=>({ctx:!!ac,state:ac?ac.state:'none',muted,music:music.on,rain:!!rainNode}); // for tests
})();
</script>
