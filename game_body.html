<title>Token Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 256x240 arcade screen centered on a dark server-room cabinet; the canvas is the page. Deliberately single-theme (arcade). */
:root{
  --cab:#0a0a12;
  --bezel:#262238;
  --ink:#e9e4d8;
  --dim:#8a8494;
  --accent:#3cd0ff;
  --glow:rgba(138,92,245,.18);
  --font-ui:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sl:4px;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0; box-sizing:border-box; background:var(--cab); color:var(--ink);
  font:600 11px/1.6 var(--font-ui); letter-spacing:.08em;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.screen{position:relative; line-height:0; max-width:100%}
canvas{
  display:block; max-width:100%;
  image-rendering:pixelated; image-rendering:crisp-edges;
  cursor:crosshair; background:#2a6fd6; border-radius:3px;
  box-shadow:0 0 0 4px #000, 0 0 0 7px var(--bezel), 0 0 48px var(--glow);
}
canvas:focus-visible{outline:2px solid var(--accent); outline-offset:9px}
.crt{
  position:absolute; inset:0; pointer-events:none; border-radius:3px;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0, rgba(0,0,0,.20) 1px, transparent 1px, transparent var(--sl));
}
.crt::after{content:""; position:absolute; inset:0; border-radius:3px; box-shadow:inset 0 0 70px rgba(0,0,0,.42)}
#crtgl{position:absolute; left:0; top:0; display:block; pointer-events:none; border-radius:3px; background:#000}
.foot{color:var(--dim); font-size:10px; letter-spacing:.08em; text-align:center; line-height:1.9; max-width:60ch}
@media (max-width:600px){ body{justify-content:flex-start; padding-block:10px} }
@media (hover:none) and (pointer:coarse){ .foot .keys{display:none} }
body.touch #share,body.touch #brag{bottom:-42px} body.touch.over .foot{margin-top:34px} /* on a phone the buttons sit under the cabinet, never over the HUD */
body.pointer canvas:focus-visible{outline:none}
.foot b{color:var(--accent); font-weight:normal}
#cardbox{position:fixed; inset:0; z-index:20; background:rgba(5,5,10,.88); display:flex; align-items:center; justify-content:center; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:16px}
.cardwrap{display:flex; flex-direction:column; align-items:center; gap:12px; max-width:100%}
#cardimg{display:block; width:min(86vw,72vh,540px); height:auto; image-rendering:pixelated; border:3px solid var(--bezel); user-select:auto; -webkit-user-select:auto; -webkit-touch-callout:default}
.cardhint{font:600 10px/1.6 var(--font-ui); letter-spacing:.08em; color:var(--dim); text-align:center}
#cardclose{font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--accent); border:0; padding:9px 16px; border-radius:2px; cursor:pointer}
#cardclose:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
#share{position:absolute; left:50%; bottom:-14px; transform:translateX(-112%); z-index:2; font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--ink); border:0; padding:8px 12px; cursor:pointer; border-radius:2px; box-shadow:0 2px 0 #000}
#brag{position:absolute; left:50%; bottom:-14px; transform:translateX(12%); z-index:2; font:700 11px/1 var(--font-ui); letter-spacing:.1em; color:var(--cab); background:var(--accent); border:0; padding:8px 12px; cursor:pointer; border-radius:2px; box-shadow:0 2px 0 #000}
#bragtxt{position:absolute; left:50%; bottom:-40px; transform:translateX(-50%); z-index:2; width:max(90%,280px)}
#brag:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
#bragtxt{font:11px/1.8 var(--font-ui); color:var(--ink); user-select:text; -webkit-user-select:text; max-width:60ch; text-align:center; word-break:break-all}
@media (prefers-reduced-motion:reduce){.crt{display:none}}
</style>

<div class="screen">
  <canvas id="g" width="256" height="240" tabindex="0" aria-label="Token Hunt game screen"></canvas>
  <canvas id="crtgl" hidden aria-hidden="true"></canvas>
  <div class="crt" id="crt"></div>
  <button id="share" type="button" hidden>SHARE CARD</button>
  <button id="brag" type="button" hidden>COPY TEXT</button>
  <div id="bragtxt" hidden></div>
</div>
<div id="cardbox" hidden role="dialog" aria-label="Share card"><div class="cardwrap"><img id="cardimg" alt="Your Token Hunt result card"><div class="cardhint">LONG-PRESS OR RIGHT-CLICK THE CARD TO SAVE IT</div><button id="cardclose" type="button">CLOSE</button></div></div>
<input id="code" type="text" inputmode="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Enter a code" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none">
<div class="foot" id="foot">TAP TO SERVE <span class="keys">&middot; <b>M</b> MUTE &middot; <b>P</b> PAUSE &middot; <b>C</b> CRT</span> &middot; ONE FILE. ZERO ASSETS. ZERO NETWORK REQUESTS.</div>

<script>
(()=>{
'use strict';
/*__SPRITES__*/

// ------------------------------------------------------------------ setup
const W=256, H=240, SKY_H=200, GROUND=168, FRONT=188;
const cv=document.getElementById('g');
const ctx=cv.getContext('2d',{alpha:false});
const crt=document.getElementById('crt');
// Determinism: two seeded streams drive the simulation (G.rng: spawns + flight paths, G.rng2: dialogue, lightning, critic placement);
// fxRng is cosmetic only (particles, rain, shake jitter, chirp pitch) and may differ between a run and its replay.
function makeRng(seed){ let a=seed>>>0; const f=()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; f.get=()=>a; f.set=v=>{ a=v|0; }; return f; }
const fxRng=makeRng(Math.random()*4294967296);
const rnd=(a,b)=>a+fxRng()*(b-a);        // cosmetic
const srnd=(a,b)=>a+G.rng2()*(b-a);      // simulation
const pad=(n,w)=>String(Math.max(0,n|0)).padStart(w,'0');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ------------------------------------------------------------------ sprites
function bake(rows, mirrorX, flat){
  const w=rows[0].length, h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); const img=x.createImageData(w,h); const d=img.data;
  for(let y=0;y<h;y++){ const r=rows[y];
    for(let i=0;i<w;i++){ const ch=r[mirrorX? w-1-i : i]; if(ch==='.') continue;
      const n=parseInt((flat||PAL[ch]).slice(1),16); const o=(y*w+i)*4;
      d[o]=n>>16&255; d[o+1]=n>>8&255; d[o+2]=n&255; d[o+3]=255; } }
  x.putImageData(img,0,0); return c;
}
function glitchRows(rows,seed){ const r=seeded(seed); return rows.map(row=>row.split('').map(ch=> ch!=='.'&&r()<0.18 ? (r()<0.5?'R':'K') : ch).join('')); }
const S={};
for(const k in SPR){ S[k]=bake(SPR[k]); S[k+'L']=bake(SPR[k],true); S[k+'W']=bake(SPR[k],false,'#ffffff'); S[k+'WL']=bake(SPR[k],true,'#ffffff'); S[k+'R']=bake(SPR[k],false,'#ff4d4d'); S[k+'RL']=bake(SPR[k],true,'#ff4d4d');
  if(/^(lo|hi|bird|gold)\d$/.test(k)){ const g=glitchRows(SPR[k],k.length*131+k.charCodeAt(2)); S[k+'G']=bake(g); S[k+'GL']=bake(g,true); } }
const BIRD_FRAMES=[0,1,2,1];
const SHADOW='#1a1420';

function icon(rows,x,y,col){ ctx.fillStyle=col; for(let r=0;r<rows.length;r++) for(let c=0;c<rows[r].length;c++) if(rows[r][c]==='X') ctx.fillRect(x+c,y+r,1,1); }

// ------------------------------------------------------------------ bitmap font (3x5)
const GLY={}; for(const k in FONT) GLY[k]=FONT[k].split(' ');
function text(s,x,y,col,sc){ sc=sc||1; ctx.fillStyle=col; s=String(s).toUpperCase(); let cx=x;
  for(const ch of s){ const g=GLY[ch]||GLY[' '];
    for(let r=0;r<5;r++){ const row=g[r]; for(let c=0;c<3;c++) if(row[c]==='1') ctx.fillRect(cx+c*sc,y+r*sc,sc,sc); }
    cx+=4*sc; } }
const textW=(s,sc)=>String(s).length*4*(sc||1)-(sc||1);
function textS(s,x,y,col,sc){ sc=sc||1; text(s,x+sc,y+sc,SHADOW,sc); text(s,x,y,col,sc); }
function textC(s,y,col,sc,shadow){ sc=sc||1; const x=Math.round(W/2-textW(s,sc)/2); (shadow?textS:text)(s,x,y,col,sc); }
// 5x7 display face for the title: 6 columns per letter, 2px drop shadow, centered
const BIGG={}; for(const k in BIG) BIGG[k]=BIG[k].split(' ');
function bigText(s,y,col,sc){ const w=s.length*6*sc-sc; let cx=Math.round(W/2-w/2);
  for(let pass=0;pass<2;pass++){ ctx.fillStyle= pass?col:SHADOW; const off=pass?0:2; let x=cx;
    for(const ch of s){ const g=BIGG[ch]; if(g) for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(g[r][c]==='1') ctx.fillRect(x+c*sc+off,y+r*sc+off,sc,sc); x+=6*sc; } } }

// ------------------------------------------------------------------ pixel primitives
function fillEllipse(cx,cy,rx,ry,col){ ctx.fillStyle=col; for(let y=-ry;y<=ry;y++){ const t=1-(y*y)/(ry*ry); if(t<0) continue; const hw=Math.floor(Math.sqrt(t)*rx); ctx.fillRect(cx-hw,cy+y,hw*2+1,1); } }
function seeded(n){ let s=n|0||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }

// ------------------------------------------------------------------ audio (all synthesized; E3: mixed, not summed)
// graph: voices -> [StereoPanner by screen x] -> sfx | voice bus; music layers -> duck (sidechain) -> music bus; buses -> master (mute)
//        -> DynamicsCompressor (-18 dB, 4:1) -> out. Music ducks -8 dB for 180 ms on hits and when the bot starts speaking.
let ac=null, master=null, comp=null, BUS=null, muted=false, noiseBuf=null, rainNode=null, quiet=false; // quiet: fast-forwarding a replay, no sound
try{ muted=localStorage.getItem('th.muted')==='1'; }catch(e){}
const DUCK=Math.pow(10,-8/20), LAYERS=['base','arp','drums','storm','boss'];
function audioInit(){ if(ac) return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=muted?0:0.5;
    comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4; comp.knee.value=6; comp.attack.value=0.004; comp.release.value=0.2; master.connect(comp); comp.connect(ac.destination);
    const bus=(v,to)=>{ const g=ac.createGain(); g.gain.value=v; g.connect(to||master); return g; };
    BUS={ music:bus(0.9), sfx:bus(1), voice:bus(0.9), ducks:0, pans:0, layer:{} }; BUS.duck=bus(1,BUS.music);
    for(const k of LAYERS) BUS.layer[k]=bus(k==='base'?1:0,BUS.duck);
  }catch(e){ ac=null; BUS=null; } }
function getNoise(){ if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
const panX=x=> x==null||!Number.isFinite(x)? 0 : clamp((x/W)*1.6-0.8,-0.8,0.8);
function route(node,pan,bus){ if(pan&&ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=clamp(pan,-0.8,0.8); node.connect(p); node=p; BUS.pans++; BUS.lastPan=p.pan.value; } node.connect(bus||BUS.sfx); }
function tone(f,dur,type,vol,slideTo,when,pan,bus){ if(!ac||quiet) return; const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f,t); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(vol==null?0.25:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); route(g,pan,bus); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,vol,when,filterHz,pan,bus,ftype){ if(!ac||quiet) return; const t=ac.currentTime+(when||0);
  const s=ac.createBufferSource(); s.buffer=getNoise(); const g=ac.createGain();
  g.gain.setValueAtTime(vol==null?0.3:vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  let node=s; if(filterHz){ const f=ac.createBiquadFilter(); f.type=ftype||'lowpass'; f.frequency.value=filterHz; s.connect(f); node=f; }
  node.connect(g); route(g,pan,bus); s.start(t); s.stop(t+dur+0.02); }
function musicDuck(){ if(!ac||!BUS||quiet) return; const g=BUS.duck.gain, t=ac.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(DUCK,t+0.012); g.setValueAtTime(DUCK,t+0.18); g.linearRampToValueAtTime(1,t+0.3); BUS.ducks++; }
const SFX={
  shot(x){ const p=panX(x); noise(0.18,0.35,0,1800,p); tone(150,0.12,'square',0.3,60,0,p); },
  flap(x){ const p=panX(x); tone(220,0.04,'square',0.08,null,0,p); tone(270,0.04,'square',0.08,null,0.06,p); },
  hit(m,x){ const p=panX(x), k=Math.pow(2,(2*((m||1)-1))/12); tone(660*k,0.07,'square',0.25,null,0,p); tone(880*k,0.07,'square',0.25,null,0.07,p); tone(1320*k,0.12,'square',0.25,null,0.14,p); musicDuck(); },
  gold(x){ const p=panX(x); [1046,1318,1568,2093].forEach((f,i)=>tone(f,0.06,'square',0.22,null,i*0.06,p)); musicDuck(); },
  fall(x){ tone(1500,0.7,'triangle',0.22,240,0,panX(x)); },
  thud(x){ const p=panX(x); noise(0.12,0.35,0,400,p); tone(80,0.1,'triangle',0.3,40,0,p); },
  laugh(x){ const p=panX(x); [520,470,420,380,340].forEach((f,i)=>tone(f,0.09,'square',0.22,null,i*0.11,p,BUS&&BUS.voice)); },
  away(){ tone(900,0.5,'square',0.15,200); },
  fanfare(){ [392,523,659,784].forEach((f,i)=>tone(f,0.12,'square',0.22,null,i*0.12)); tone(1046,0.4,'square',0.22,null,0.48); },
  clear(){ [523,659,784,1046,784,1046].forEach((f,i)=>tone(f,0.11,'square',0.22,null,i*0.11)); },
  perfect(){ [523,659,784,1046,1318,1568,2093].forEach((f,i)=>tone(f,0.08,'square',0.22,null,i*0.07)); tone(2093,0.5,'square',0.2,null,0.5); },
  over(){ [440,415,392,370,349,330,311,294].forEach((f,i)=>tone(f,0.16,'triangle',0.25,null,i*0.17)); tone(262,0.9,'triangle',0.25,null,1.4); },
  thunder(when,x){ noise(1.4,0.45,when||0,220,panX(x)); },
  blip(x){ tone(880,0.05,'square',0.15,null,0,panX(x),BUS&&BUS.voice); },
  wrong(x){ const p=panX(x); tone(220,0.12,'square',0.3,160,0,p); tone(160,0.25,'square',0.3,90,0.12,p); musicDuck(); },
  tick(){ tone(1200,0.03,'square',0.12); },
  chirp(x){ tone(520+fxRng()*420,0.035,'square',0.07,null,0,panX(x),BUS&&BUS.voice); },
};
function rainStart(level){ if(!ac||rainNode||quiet) return; const s=ac.createBufferSource(); s.buffer=getNoise(); s.loop=true;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=level>1?800:1500; f.Q.value=0.6;
  const g=ac.createGain(); g.gain.value=level>1?0.10:0.06; s.connect(f); f.connect(g); g.connect(BUS.sfx); s.start(); rainNode={s,g}; }
function rainStop(){ if(rainNode){ try{ rainNode.s.stop(); }catch(e){} rainNode=null; } }

// 4-bar chiptune loop, 64 steps. Vertical layering: base always; arpeggio at combo >= 3; drums at combo >= 6; sub-bass + fast hats
// in the storm and autoscale loads. Layer changes are quantized to the next bar line and fade over one bar.
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const LEAD=[72,0,76,0,79,0,76,0,81,0,79,0,76,0,74,0, 72,0,76,0,79,0,76,0,83,0,81,0,79,0,76,0, 74,0,77,0,81,0,77,0,83,0,81,0,77,0,74,0, 72,0,76,0,79,0,84,0,83,0,79,0,76,0,72,0];
const BASS=[36,0,36,0,43,0,43,0,36,0,36,0,43,0,43,0, 36,0,36,0,43,0,43,0,36,0,36,0,43,0,43,0, 38,0,38,0,45,0,45,0,38,0,38,0,45,0,45,0, 43,0,43,0,36,0,36,0,43,0,43,0,36,0,36,0];
const music={on:false,step:0,next:0,timer:null,semi:0,stepLen:0.15,root:36, tgt:{arp:0,drums:0,storm:0,boss:0}, play:{arp:0,drums:0,storm:0,boss:0},
  start(){ if(!ac||this.on||quiet) return; this.on=true; this.step=0; this.next=ac.currentTime+0.05; this.timer=setInterval(()=>this.tick(),50); },
  stop(){ this.on=false; if(this.timer) clearInterval(this.timer); this.timer=null; },
  desired(){ const c=G.combo||0, wx=G.wx||{}; const live=G.state!=='title'&&G.state!=='gameOver'; return {arp:live&&c>=3?1:0, drums:live&&c>=6?1:0, storm:live&&(wx.storm||wx.gust)?1:0, boss:live&&G.birds.some(b=>b.boss&&b.st==='fly')?1:0}; },
  bar(at){ const d=this.desired(), dur=this.stepLen*16; for(const k in d){ const g=BUS.layer[k].gain;
      if(d[k]!==this.tgt[k]){ this.tgt[k]=d[k]; g.cancelScheduledValues(at); g.setValueAtTime(1-d[k],at); g.linearRampToValueAtTime(d[k],at+dur); this.play[k]=1; }
      else if(!d[k]) this.play[k]=0; } },
  tick(){ if(!ac||!BUS) return; const L=BUS.layer; while(this.next<ac.currentTime+0.25){ const i=this.step%64, s=this.semi; const l=LEAD[i], b=BASS[i]; const when=Math.max(0,this.next-ac.currentTime);
    if(i%16===0) this.bar(this.next); if(b) this.root=b;
    if(l) tone(NOTE(l+s),0.12,'square',0.06,null,when,0,L.base); if(b) tone(NOTE(b+s),0.14,'triangle',0.16,null,when,0,L.base); if(i%4===0) noise(0.03,0.04,when,5000,0,L.base);
    if(this.play.arp) tone(NOTE(this.root+24+[0,4,7,12][i%4]+s),0.07,'square',0.035,null,when,i%2?0.35:-0.35,L.arp);
    if(this.play.drums){ if(i%8===0||i%16===6){ tone(120,0.12,'triangle',0.4,42,when,0,L.drums); noise(0.03,0.12,when,300,0,L.drums); } if(i%8===4) noise(0.12,0.16,when,2200,0,L.drums,'bandpass'); }
    if(this.play.boss){ tone(NOTE(this.root+12+[0,0,12,0,3,0,10,7][i%8]+s),0.1,'sawtooth',0.045,null,when,0,L.boss); if(i%4===2) noise(0.06,0.09,when,1200,0,L.boss,'bandpass'); }
    if(this.play.storm){ if(b) tone(NOTE(b+s-12),0.28,'sine',0.24,null,when,0,L.storm); noise(0.02,0.035,when,7000,i%2?0.5:-0.5,L.storm,'highpass'); }
    this.next+=this.stepLen; this.step++; } } };
function toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:0.5; try{ localStorage.setItem('th.muted',muted?'1':'0'); }catch(e){} if(muted) hush(); }

// ------------------------------------------------------------------ the bot speaks (E2)
// Each critic line goes to the browser's built-in speechSynthesis with a LOCAL voice only (network voices would break the
// zero-network promise), pitch 1.4, rate 1.15. Off until the first user gesture, silenced by the mute icon, never in replays or
// the demo. Without the API or a local voice, the chirp typewriter carries the line. Purely cosmetic: nothing here feeds the sim.
const VOICE={ok:false, voice:null, gesture:false, talking:false, until:0, utt:null, boundary:0, boundarySeen:false, said:0, open:0};
function voicePick(){ try{ const vs=window.speechSynthesis.getVoices()||[]; const en=vs.filter(v=>v&&v.localService===true&&/^en/i.test(v.lang||''));
    VOICE.voice= en.find(v=>/samantha|daniel|google|karen|moira|zira|david|fred|alex/i.test(v.name)) || en[0] || null; VOICE.ok=!!VOICE.voice; }catch(e){ VOICE.ok=false; } }
try{ if(window.speechSynthesis){ voicePick(); if(window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged',voicePick); } }catch(e){}
const ACRO=/\b(ai|gpu|gpus|vram|bios|rps|ok)\b/gi;
function speechText(s){ return String(s).toLowerCase().replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(ACRO,m=>m.toUpperCase()).replace(/\bi\b/g,'I').replace(/\bi'/g,"I'"); }
function voiceGesture(){ if(VOICE.gesture) return; VOICE.gesture=true; // iOS only lets speech start from inside a gesture: prime it with silence
  try{ if(VOICE.ok&&window.SpeechSynthesisUtterance){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); } }catch(e){} }
function voiceLive(){ return VOICE.talking&&performance.now()<VOICE.until; }

    u.onstart=()=>{ if(VOICE.utt===u) musicDuck(); }; u.onend=u.onerror=()=>{ if(VOICE.utt===u){ VOICE.talking=false; VOICE.utt=null; } };
    u.onboundary=()=>{ if(VOICE.utt===u){ VOICE.boundarySeen=true; VOICE.boundary=performance.now(); } };

const MAX_SHAKE=9;
function addTrauma(v){ G.trauma=Math.min(1,(G.trauma||0)+v); }

function shakeOffset(now){ const tr=G.trauma||0; if(tr<=0||G.paused||REDUCED) return [0,0]; const a=MAX_SHAKE*tr*tr, k=now/1000*24; return [a*vnoise(k), a*vnoise(k+57.3)]; }

function resetRunState(){ resetRun(); G.bossDone=false; G.swarmDone=false; G.vramLost=0; G.swarm=null; G.round=1; G.score=0; G.cost=0; G.wave=0; G.tally=[]; G.birds=[]; G.fx=[]; G.newRecord=false; G.combo=0; G.comboFlash=0; G.streak={hit:0,miss:0}; G.nearMiss=false;
  G.freeze=0; G.flash=0; G.flashA=0; G.flashCol=null; G.trauma=0; G.muzzle=null; G.tapMark=null; G.flightT=0; G.hallucServed=false; G.hallucEscaped=false; G.realEscaped=false; G.perfect=false; G.needFlash=0; G.paused=false;
  G.shots=G.assist?5:D.ammo; G.fox={mode:null,t:0,x:112,count:0,line:''};
  G.prevHi=false; G.prevHallucServed=false; G.wf=newFacts(); G.unpauseT=0; G.lastShotF=-99; }
function seedRun(seed){ G.seed=seed>>>0; G.rng=makeRng(G.seed); G.rng2=makeRng(G.seed^0x5bd1e995); }
function startGame(attract,skipBoot){ G.attract=!!attract; G.idle=0; G.taps=[]; G.recOn=false; seedRun(G.daily? dailySeed()*7919 : Math.random()*4294967296); resetRunState(); setWeather();
  if(G.attract){ G.state='intro'; G.t=0; return; }
  if(skipBoot){ bootDone(); return; }
  G.state='boot'; G.t=0; G.boot={t:0,line:-1}; }
function bootDone(){ G.state='intro'; G.t=0; SFX.fanfare(); music.start(); if(!G.attract&&!G.replay) recStart(); }

// ------------------------------------------------------------------ record / replay (E0)
// A run is (snapshot at bootDone, inputs stamped with the sim frame they arrived after). Inputs only ever reach the sim between
// update() calls (event handlers never run inside a step), so replaying input k just before step G.frame===k reproduces the run.
function snap(){ return { seed:G.seed, r1:G.rng.get(), r2:G.rng2.get(), diff:G.diff, theme:G.theme, assist:G.assist, daily:G.daily, seen:G.seen, fmd:!!G.firstMissDone, lastLine:G.lastLine,
  cheat:!!G.cheatPending, ws:G.wavesStarted||0, keys:G.keys, windDir:G.windDir, nl:G.nextLightning, clouds:G.clouds.map(c=>({x:c.x,y:c.y,w:c.w})) }; }
function recStart(){ G.frame=0; G.rec=[]; G.recInit=snap(); G.recOn=true; }
function recIn(type,a,b){ if(G.recOn&&!G.replay&&G.rec.length<60000) G.rec.push(b===undefined?[G.frame,type,a]:[G.frame,type,a,b]); }
function applyInput(e){ const ty=e[1]; if(ty==='k'){ feedKeyRaw(e[2]); return; } if(ty==='u'){ G.unpauseT=24; return; } G.mouse.touch= ty==='t'; G.mouse.x=e[2]; G.mouse.y=e[3]; G.mouse.on=true; handleTap(e[2],e[3]); }
function restoreRun(s){ setDiff(s.diff); applyTheme(s.theme); G.assist=!!s.assist; G.daily=!!s.daily; G.seen=!!s.seen; G.firstMissDone=s.fmd; G.lastLine=s.lastLine; G.cheatPending=s.cheat; G.wavesStarted=s.ws; G.keys=s.keys;
  G.attract=false; G.recOn=false; resetRunState(); setWeather(); seedRun(s.seed); G.rng.set(s.r1); G.rng2.set(s.r2); G.windDir=s.windDir; G.nextLightning=s.nl; G.lightning=0; G.clouds=s.clouds.map(c=>({...c})); G.frame=0; }
function startReplay(run,speed){ if(!run||!run.init) return false; hush(); hideBrag(); cardBox.hidden=true; music.stop(); rainStop();
  G.replay={rec:run.rec.map(e=>e.slice()), i:0, speed:speed||2, end:run.frames||0, run};
  restoreRun(run.init); G.state='intro'; G.t=0; if(G.wx.rain) rainStart(G.wx.rain); SFX.fanfare(); music.start(); return true; }
function replayFeed(){ const R=G.replay; while(R.i<R.rec.length&&R.rec[R.i][0]<=G.frame) applyInput(R.rec[R.i++]);
  // ghost cursor: glide toward the next recorded tap so the replay reads like a person playing
  for(let j=R.i;j<R.rec.length&&j<R.i+4;j++){ const e=R.rec[j]; if(e[1]==='k'||e[1]==='u') continue; if(e[0]-G.frame<45){ G.mouse.x+=(e[2]-G.mouse.x)*0.18; G.mouse.y+=(e[3]-G.mouse.y)*0.18; G.mouse.on=true; } break; } }
function endReplay(){ const R=G.replay; if(!R) return; G.replay=null; G.newRecord=!!R.run.newRecord; if(G.state==='gameOver') showBrag(); }
function skipReplay(){ if(!G.replay) return; const cap=G.replay.end+3600; G.paused=false; quiet=true; try{ let n=0; while(G.replay&&n<cap){ update(); n++; } } finally{ quiet=false; } if(G.replay) endReplay(); }
function watchReplay(){ if(G.lastRun&&startReplay(G.lastRun,2)){ SFX.blip(); } }
function beginFirstWave(){ if(!G.seen&&!G.attract){ G.seen=true; try{ localStorage.setItem('th.seen','1'); }catch(e){}
    G.state='fox'; G.fox.t=0; G.fox.mode='tut'; G.fox.count=0; G.fox.line=line('tutorial'); G.fox.x=112; SFX.blip(); } else startWave(); }
const newFacts=()=>({hi:0,lastShot:false,firstShot:false,frozen:false,hiEscaped:false,shots:0});
function startWave(){ G.state='fly'; G.shots=G.assist?5:(D.ammo-(G.vramLost||0)); G.flightT=0; G.nearMiss=false; G.hallucServed=false; G.hallucEscaped=false; G.realEscaped=false; G.swarm=null; G.wf=newFacts(); const left=EPOCH_LEN-G.wave; let n=1;
  if(!G.attract&&!G.bossDone&&G.round%4===0&&G.wave===2){ G.bossDone=true; G.state='fox'; G.fox.t=0; G.fox.count=0; G.fox.mode='warn'; G.fox.line=line('bossIn'); G.fox.x=112; SFX.wrong(); return; }
  if(!G.attract&&!G.swarmDone&&G.round%4!==0&&G.round>=(D.mult>=2||D.daily?2:3)&&G.wave===3){ startSwarm(); return; }
  if(left>=2&&G.round>=D.doublesFrom&&G.rng()<Math.min(0.8,D.doubleP+late()*0.05)) n=2;
  if(n===2&&left>=3&&G.round>=RULE.burst&&!G.attract&&G.rng()<0.45) n=3;
  G.birds=[]; for(let i=0;i<n;i++) G.birds.push(spawnBird(i,n,false)); G.wave+=n;
  G.wavesStarted=(G.wavesStarted||0)+1;
  if(G.forceHalluc||(G.round===1&&G.wavesStarted===2&&!G.attract)||G.rng()<Math.min(0.4,D.halluc+late()*0.03)){ let h=null; for(let k=0;k<10;k++){ h=spawnBird(n,n+1,true); h.x=58+G.rng()*116; if(G.birds.every(b=>Math.abs(b.x-h.x)>=30)) break; } G.birds.push(h); }
  SFX.flap(); }
// E5 boss: a 48x40 DDoS crosses slowly; 6 hits; every 2nd hit splits off two rogue agents; escaping costs 1 VRAM for the epoch
function startBoss(){ G.state='fly'; G.swarm={t:0,stopped:0,breached:0,total:0,boss:true,killed:false,escaped:false}; G.wf=newFacts(); G.flightT=0; G.nearMiss=false; G.hallucServed=false; G.hallucEscaped=false; G.realEscaped=false;
  G.shots=G.assist?16:Math.max(8,14-2*(G.vramLost||0)); const dir=G.rng()<0.5?1:-1;
  G.birds=[{boss:true,x:dir>0?-50:W+2,y:34,y0:34,vx:dir*0.42,vy:0,sp:0.42,tier:'lo',bad:false,st:'fly',f:0,at:0,dirT:1e9,hitT:0,hp:6}];
  G.fx.push({type:'pts',x:Math.round(W/2-textW(T.boss.name,2)/2),y:86,t:0,txt:T.boss.name,col:'#ff4d4d',sc:2}); G.flash=4; G.flashA=0.25; G.flashCol='255,77,77'; addTrauma(0.35); SFX.away(); }
function bossHit(b){ b.hp--; b.hitT=6; G.run.hits++; G.combo++; if(G.combo>G.run.bestCombo) G.run.bestCombo=G.combo; const p=300*D.mult*(G.assist?3:1); G.score+=p; G.freeze=3; addTrauma(0.3); buzz(15); SFX.hit(Math.min(3,7-b.hp),b.x+24);
  G.fx.push({type:'pts',x:clamp(b.x+14,2,W-30),y:Math.max(6,b.y-6),t:0,txt:'+'+p,col:'#ffe98a',sc:1}); for(let i=0;i<8;i++) G.fx.push({type:'feather',x:b.x+24,y:b.y+20,vx:rnd(-1.6,1.6),vy:rnd(-1.8,0.4),t:0,col:'#ff4d4d'});
  if(b.hp%2===0){ for(let i=0;i<2;i++){ const vx=(i?1:-1)*(0.6+G.rng()*0.5); G.birds.push({x:clamp(b.x+14+i*10,0,W-12),y:b.y+26,vx,vy:1.0+G.rng()*0.35,sp:1.2,tier:'lo',bad:false,agent:true,st:'fly',f:0,at:0,dirT:1e9,hitT:0}); } G.swarm.total+=2; }
  if(b.hp<=0){ b.st='gone'; G.swarm.killed=true; const bonus=5000*D.mult*(G.assist?3:1); G.score+=bonus; G.freeze=8; addTrauma(0.7); G.flash=8; G.flashA=0.4; G.flashCol='255,255,255'; SFX.perfect();
    G.fx.push({type:'pts',x:Math.round(W/2-textW(T.boss.win+' +'+bonus,1)/2),y:64,t:0,txt:T.boss.win+' +'+bonus,col:'#39d353',sc:1}); for(let i=0;i<24;i++) G.fx.push({type:'feather',x:b.x+24,y:b.y+20,vx:rnd(-2.5,2.5),vy:rnd(-2.5,1),t:0,col:i%2?'#ff4d4d':'#ffe98a'}); } }
function startSwarm(){ G.swarmDone=true; G.swarm={t:0,stopped:0,breached:0,total:4}; G.birds=[]; G.wf=newFacts(); const spare=(D.mult>=2||D.daily)?1:2; // Easy/Medium forgive one miss; Hard/Daily do not
  G.shots=G.assist?5:Math.max(2,D.ammo+spare-(G.vramLost||0)); G.flightT=0;
  for(let i=0;i<4;i++){ const x=20+i*60+G.rng()*30; G.birds.push({x,y:-14-i*22,vx:(G.rng()<0.5?-1:1)*0.8,vy:1.1+G.rng()*0.4,sp:1.2,tier:'lo',bad:false,agent:true,st:'fly',f:0,at:0,dirT:1e9,hitT:0}); }
  G.fx.push({type:'pts',x:Math.round(W/2-textW(T.swarm.name,2)/2),y:40,t:0,txt:T.swarm.name,col:'#ff4d4d',sc:2});
  { const h=T.swarm.hint+' '+G.shots; G.fx.push({type:'pts',x:Math.round(W/2-textW(h,1)/2),y:58,t:0,txt:h,col:'#ffe98a',sc:1}); }
  G.flash=4; G.flashA=0.25; G.flashCol='255,77,77'; SFX.wrong(); SFX.away(); }
// the rules that arrive with later epochs (announced on the epoch card): 4 = hallucinations can wear frontier purple, 5 = bursts of three, 7+ = everything keeps climbing
const RULE={mimic:4, burst:5, climb:7};
const late=()=>Math.max(0,G.round-RULE.climb+1);
function spawnBird(i,n,bad){ const tier= bad? ((G.round>=RULE.mimic&&G.rng()<0.5)?'hi':'lo') : (G.rng()<TIERS.hi.p?'hi':'lo'); const tr=TIERS[tier]; const r=G.rng;
  let sp=Math.min(3.2,1.25+G.round*0.13+late()*0.08)*tr.speed*D.speed; if(G.round===1&&D.gentleStart) sp*=0.85; if(G.assist) sp*=0.75;
  const x= n===1? 58+r()*116 : n===2? 58+i*82+r()*30 : 58+i*58+r()*20; // 58..198 keeps the 24-px sprite clear of the rack panels at both edges
  // each request steers from its own seeded stream, so when you shoot never changes what spawns next (Daily stays identical for everyone)
  return {x,y:150,vx:(r()<0.5?-1:1)*sp*0.6,vy:-sp,sp,tier,bad:!!bad,st:'fly',f:0,at:0,dirT:bad?10+r()*15:tr.dirT[0]+r()*(tr.dirT[1]-tr.dirT[0]),hitT:0,r:seeded(Math.floor(r()*2147483646)+1)}; }
function newDir(b){ const r=b.r||G.rng; const up=r()<0.7||b.y>120; const a= up? 0.3+r()*(Math.PI-0.6) : -(0.35+r()*0.9);
  b.vx=Math.cos(a)*b.sp; b.vy=-Math.sin(a)*b.sp; if(Math.abs(b.vx)<0.45) b.vx=(b.vx<0?-1:1)*0.45; const tr=TIERS[b.tier]; b.dirT= b.bad? 10+r()*15 : tr.dirT[0]+r()*(tr.dirT[1]-tr.dirT[0]); }

function shoot(x,y,touch){ if(G.state!=='fly'||G.shots<=0||G.unpauseT>0) return; if(G.frame-(G.lastShotF||-9)<4) return; G.lastShotF=G.frame; // one shot per 4 frames: duplicate pointer events never burn VRAM
  const padX=touch?8:3, padDn=touch?20:3, padUp=touch?8:3;
  const inBox=b=> x>=b.x-padX&&x<=b.x+24+padX&&y>=b.y-padUp&&y<=b.y+20+padDn;
  { const fz=G.birds.find(b=>b.st==='fly'&&b.frozen>0&&!b.agent&&!b.boss&&inBox(b)); if(fz){ G.fx.push({type:'pts',x:clamp(x-6,2,W-18),y:Math.max(6,y-14),t:0,txt:T.boltLabel||'WAIT',col:'#ff4d4d',sc:1}); SFX.blip(); return; } }
  G.shots--; G.cost+=COST; G.run.shots++; G.wf.shots++; SFX.shot(x); G.flash=2; G.muzzle={x,y,t:2};
  let hitAny=false, nearest=999, target=null, td=1e9;
  const inAgent=b=> x>=b.x-padX-2&&x<=b.x+12+padX+2&&y>=b.y-padUp-2&&y<=b.y+10+padDn;
  const inBoss=b=> x>=b.x-padX&&x<=b.x+48+padX&&y>=b.y-padUp&&y<=b.y+40+padDn;
  for(const b of G.birds){ if(b.st!=='fly') continue; if(b.boss? inBoss(b) : b.agent? inAgent(b) : inBox(b)){ const d=Math.hypot(x-(b.x+(b.boss?24:b.agent?6:12)),y-(b.y+(b.boss?20:b.agent?5:10))); if(d<td){ td=d; target=b; } } }
  if(touch) G.tapMark={x,y,t:18};
  for(const b of G.birds){ if(b.st!=='fly') continue;
    if(b===target&&b.boss){ hitAny=true; bossHit(b); continue; }
    if(b===target&&b.agent){ hitAny=true; b.st='gone'; G.swarm.stopped++; const p=200*D.mult*(G.assist?3:1); G.score+=p; G.run.hits++; G.freeze=2; addTrauma(0.25); buzz(12); SFX.hit(1,b.x+6);
      G.fx.push({type:'pts',x:clamp(b.x-6,2,W-30),y:Math.max(6,b.y-8),t:0,txt:T.swarm.stop+' +'+p,col:'#ffe98a',sc:1}); for(let i=0;i<5;i++) G.fx.push({type:'feather',x:b.x+6,y:b.y+5,vx:rnd(-1.2,1.2),vy:rnd(-1.5,0),t:0,col:'#ff4d4d'});
      if(!G.swarm.boss&&G.swarm.stopped>=G.swarm.total){ const bonus=1000*D.mult*(G.assist?3:1); G.score+=bonus; G.fx.push({type:'pts',x:Math.round(W/2-textW(T.swarm.stopAll+' +'+bonus,1)/2),y:72,t:0,txt:T.swarm.stopAll+' +'+bonus,col:'#39d353',sc:1}); SFX.perfect(); } continue; }
    if(b===target){ hitAny=true; b.st='hit'; b.hitT=0; G.freeze=3;
      if(b.bad){ G.score=Math.max(0,G.score-500); G.combo=0; G.hallucServed=true; G.run.hServed++; buzz(40); addTrauma(0.5); G.flash=5; G.flashA=0.3; G.flashCol='255,77,77';
        G.fx.push({type:'pts',x:clamp(b.x-2,2,W-2-textW('-500',2)),y:Math.max(6,b.y-4),t:0,txt:'-500',col:T.fx.badPop,sc:2}); SFX.wrong(b.x+12); continue; }
      const hi=b.tier==='hi'; G.combo++; const m=comboMult(G.combo); if(m!==comboMult(G.combo-1)) G.comboFlash=10;
      const p=valueOf(b)*m*(G.assist?3:1); G.score+=p; G.tally.push('hit'); G.run.hits++; if(hi){ G.run.frontier++; G.wf.hi++; } if(G.shots===0) G.wf.lastShot=true; if(G.wf.shots===1) G.wf.firstShot=true; if(G.combo>G.run.bestCombo) G.run.bestCombo=G.combo; buzz(hi?25:12); addTrauma(hi?0.4:0.25); if(hi){ G.freeze=5; G.flash=4; G.flashA=0.35; }
      { const sc=(hi||m>1)?2:1, txt='+'+p; G.fx.push({type:'pts',x:clamp(b.x-2,2,W-2-textW(txt,sc)),y:Math.max(6,b.y-4),t:0,txt,col:hi?T.fx.hiPop:T.fx.loPop,sc}); }
      for(let i=0;i<6;i++) G.fx.push({type:'feather',x:b.x+12,y:b.y+10,vx:rnd(-1,1),vy:rnd(-1.5,0),t:0,col:hi?T.fx.featherHi:T.fx.featherLo});
      if(hi) SFX.gold(b.x+12); else SFX.hit(m,b.x+12); }
    else if(!b.bad&&!b.boss){ const d=Math.hypot(x-(b.x+12),y-(b.y+10)); if(d<nearest) nearest=d; } }
  if(!hitAny){ if(nearest<24) G.nearMiss=true; if(G.combo>0){ G.combo=Math.floor(G.combo/2); G.comboFlash=8; } } } // a wasted shot costs half the combo: x3 has to be earned clean

function updateBirds(){ let limit=Math.max(150,460-G.round*18); if(G.wx.shortFlight) limit=Math.round(limit*0.7); let flying=0;
  for(const b of G.birds){
    if(b.boss){ if(b.st!=='fly') continue; flying++; b.at++; b.x+=b.vx; b.y=b.y0+Math.sin(b.at/38)*7; if(b.hitT>0) b.hitT--;
      if((b.vx>0&&b.x>W+4)||(b.vx<0&&b.x<-52)){ b.st='gone'; G.swarm.escaped=true; G.vramLost=1; G.combo=0; addTrauma(0.6); G.flash=6; G.flashA=0.3; G.flashCol='255,77,77'; SFX.wrong();
        G.fx.push({type:'pts',x:Math.round(W/2-textW(T.boss.loss,1)/2),y:72,t:0,txt:T.boss.loss,col:'#ff4d4d',sc:1}); }
      continue; }
    if(b.agent&&b.st==='fly'){ flying++; b.at++; b.x+=b.vx+Math.sin(b.at/7)*0.9; b.y+=b.vy; if(b.x<0){ b.x=0; b.vx=Math.abs(b.vx); } if(b.x>W-12){ b.x=W-12; b.vx=-Math.abs(b.vx); }
      if(b.y>=FRONT-12){ b.st='gone'; G.swarm.breached++; G.combo=0; addTrauma(0.6); G.flash=5; G.flashA=0.3; G.flashCol='255,77,77'; SFX.wrong(b.x+6);
        if(G.swarm.boss){ G.score=Math.max(0,G.score-300); G.fx.push({type:'pts',x:clamp(b.x-6,2,W-26),y:FRONT-24,t:0,txt:'-300',col:'#ff4d4d',sc:1}); } // boss splinters sting; only the boss itself costs VRAM
        else { G.vramLost=1; if(G.swarm.breached===1) G.fx.push({type:'pts',x:Math.round(W/2-textW(T.swarm.breach,1)/2),y:72,t:0,txt:T.swarm.breach,col:'#ff4d4d',sc:1}); } }
      continue; }
    if(b.st==='fly'){ flying++; if(b.frozen>0){ b.frozen--; continue; } b.x+=b.vx+G.wind*0.9; b.y+=b.vy; b.dirT--; if(b.dirT<=0) newDir(b);
      if(b.x<0){ b.x=0; b.vx=Math.abs(b.vx); } if(b.x>W-24){ b.x=W-24; b.vx=-Math.abs(b.vx); }
      if(b.y<6){ b.y=6; b.vy=Math.abs(b.vy); } if(b.y>150){ b.y=150; b.vy=-Math.abs(b.vy); }
      b.at++; if(b.at%6===0){ b.f=(b.f+1)&3; if(b.f===0&&fxRng()<0.3) SFX.flap(b.x+12); } }
    else if(b.st==='hit'){ b.hitT++; if(b.hitT>=22){ b.st='fall'; b.at=0; SFX.fall(b.x+12); } }
    else if(b.st==='fall'){ b.y+=2.5; b.x+=Math.sin(b.at/5)*0.8; b.at++; if(b.y>=GROUND-6){ b.st='landed'; SFX.thud(b.x+12); b.lx=b.x;
      for(let i=0;i<8;i++) G.fx.push({type:'puff',x:b.x+8+rnd(0,8),y:GROUND,vx:rnd(-1.2,1.2),vy:rnd(-2,-0.5),t:0,col:T.fx.puff}); } }
    else if(b.st==='away'){ b.y-=3.5; b.at++; if(b.at%3===0) b.f=(b.f+1)&3; if(b.y<-26){ b.st='gone'; if(b.bad){ G.hallucEscaped=true; G.run.hDodged++; } else { G.tally.push('miss'); G.realEscaped=true; G.run.timeouts++; if(b.tier==='hi') G.wf.hiEscaped=true; } } } }
  if(!G.birds.some(b=>b.st==='fly'&&b.frozen>0)) G.flightT++; // the flight clock stops while a 429 holds the requests
  if(flying&&!G.birds.some(b=>b.st==='fly'&&!b.bad)){ for(const b of G.birds) if(b.st==='fly'&&b.bad){ b.st='away'; b.at=0; } flying=0; }

function drawScaled(img,x,y,sx,sy){ const w=img.width, h=img.height, dw=Math.max(1,Math.round(w*Math.abs(sx))), dh=Math.max(1,Math.round(h*sy)), cx=Math.round(x+w/2), cy=Math.round(y+h/2);

    ctx.fillStyle='rgba(255,77,77,0.35)'; for(let i=1;i<=4;i++){ const tx=bx-i*2*(b.vx+Math.sin((b.at-i)/7)*0.9), ty=by-i*2*b.vy; ctx.fillRect(Math.round(tx+6-(4-i)/2),Math.round(ty+4),5-i,5-i); } // red trail

const easeOutCubic=x=>1-Math.pow(1-x,3), easeInOut=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, easeInCubic=x=>x*x*x;
const easeOutBack=x=>{ const c1=1.9, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }; // ~11% overshoot: 4 px on a 35 px rise
// critic height for frame t: peek (eyes over the racks), dip 3 px (anticipation), spring up with a 4 px overshoot, settle; exit eases in
function criticY(t,hold){ const top=SKY_H-44;
  if(t<6) return SKY_H-12*easeOutCubic(t/6);
  if(t<10) return SKY_H-12+3*easeInOut((t-6)/4);
  if(t<24) return SKY_H-9+(top-(SKY_H-9))*easeOutBack((t-10)/14);
  const leave=foxLeave(); if(t<leave||hold) return top; // the bubble's dwell scales with the line (v2.9)
  return top+44*easeInCubic(Math.min(1,(t-leave)/18)); }

  const k=t-16; return k>=0&&k<line.length&&((t>>2)&1)===1; } // no voice: flap while the typewriter runs

// ------------------------------------------------------------------ CRT post-process (E1)

// texel sampling, chromatic aberration, brightness-dependent scanlines, aperture grille, quarter-res separable bloom, vignette,

// persistence; what a software renderer such as headless SwiftShader can afford), 0 = off

  crt:GLHP+'uniform sampler2D s,b;uniform vec2 ss,os,sh;uniform float t,k,n,mk;varying vec2 v;'+

function crtTier(t){ CRT.tier=t; CRT.k= t===2? CRT_K : 0; CRT.dts=[]; CRT.slow=0; crtApplyDom(); if(CRT.gl&&!CRT.lost){ CRT.gl.clearColor(0,0,0,1); CRT.gl.clear(CRT.gl.COLOR_BUFFER_BIT); } }

  crtTier(1); CRT.cal.lite=crtTime(2); if(CRT.cal.lite>12) crtTier(0); }

function fit(){ const vw=Math.max(200,window.innerWidth-32), vh=Math.max(200,window.innerHeight-80); let s=Math.min(vw/W,vh/H); if(s>=2) s=Math.floor(s);
